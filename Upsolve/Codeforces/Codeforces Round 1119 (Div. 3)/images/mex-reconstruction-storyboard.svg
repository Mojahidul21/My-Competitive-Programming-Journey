<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff" />
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937"> Phase 2 &#8212; Reconstructing the Output String </text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#6b7280"> Original array a = [1, 0, 0, 1, 2, 1] &#183; aa = [0] &#183; bb = [0] (from Phase 1) </text>
  <!-- ============ PANEL 1: build the map ============ -->
  <g transform="translate(20,80)">
    <rect x="0" y="0" width="270" height="440" rx="10" fill="#FAFAFA" stroke="#e5e7eb" />
    <text x="135" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Step 1 &#8212; build value&#8594;index map</text>
    <g transform="translate(15,44)">
      <text x="0" y="14" font-size="12" fill="#6b7280">index:</text>
      <text x="0" y="34" font-size="12" fill="#6b7280">value:</text>
      <g font-size="13" font-weight="700">
        <text x="70" y="14" text-anchor="middle" fill="#9ca3af">0</text>
        <text x="105" y="14" text-anchor="middle" fill="#9ca3af">1</text>
        <text x="140" y="14" text-anchor="middle" fill="#9ca3af">2</text>
        <text x="175" y="14" text-anchor="middle" fill="#9ca3af">3</text>
        <text x="210" y="14" text-anchor="middle" fill="#9ca3af">4</text>
        <text x="245" y="14" text-anchor="middle" fill="#9ca3af">5</text>
        <text x="70" y="34" text-anchor="middle" fill="#111827">1</text>
        <text x="105" y="34" text-anchor="middle" fill="#111827">0</text>
        <text x="140" y="34" text-anchor="middle" fill="#111827">0</text>
        <text x="175" y="34" text-anchor="middle" fill="#111827">1</text>
        <text x="210" y="34" text-anchor="middle" fill="#111827">2</text>
        <text x="245" y="34" text-anchor="middle" fill="#111827">1</text>
      </g>
    </g>
    <rect x="15" y="90" width="240" height="110" rx="6" fill="#EEF2FF" />
    <text x="25" y="112" font-size="12.5" fill="#312e81" font-weight="700">mp (value &#8594; indices):</text>
    <text x="25" y="132" font-size="12" fill="#312e81">1 &#8594; [0, 3, 5]</text>
    <text x="25" y="150" font-size="12" fill="#312e81">0 &#8594; [1, 2]</text>
    <text x="25" y="168" font-size="12" fill="#312e81">2 &#8594; [4]</text>
    <text x="25" y="190" font-size="11" fill="#4338ca">built with a plain map: order doesn't</text>
    <rect x="15" y="215" width="240" height="60" rx="6" fill="#F3F4F6" />
    <text x="135" y="235" text-anchor="middle" font-size="11.5" fill="#374151">Duplicate values (like the two 0s)</text>
    <text x="135" y="251" text-anchor="middle" font-size="11.5" fill="#374151">simply get a list of candidate</text>
    <text x="135" y="267" text-anchor="middle" font-size="11.5" fill="#374151">positions instead of just one.</text>
  </g>
  <!-- ============ PANEL 2: stamp sentinels ============ -->
  <g transform="translate(315,80)">
    <rect x="0" y="0" width="270" height="440" rx="10" fill="#FAFAFA" stroke="#e5e7eb" />
    <text x="135" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Step 2 &#8212; stamp sentinels</text>
    <text x="15" y="50" font-size="12" fill="#374151" font-weight="600">for value in aa=[0]:</text>
    <text x="25" y="68" font-size="11.5" fill="#4A90D9">pop back of mp[0] &#8594; index 2</text>
    <text x="25" y="84" font-size="11.5" fill="#4A90D9">a[2] = &#8722;1 (tie-break: LIFO &#8212;</text>
    <text x="25" y="98" font-size="11.5" fill="#4A90D9">any leftover "0" position works)</text>
    <text x="15" y="130" font-size="12" fill="#374151" font-weight="600">for value in bb=[0]:</text>
    <text x="25" y="148" font-size="11.5" fill="#50C878">pop back of mp[0] &#8594; index 1</text>
    <text x="25" y="164" font-size="11.5" fill="#50C878">a[1] = &#8722;2 (same tie-break)</text>
    <text x="15" y="200" font-size="12" fill="#374151" font-weight="700">array after stamping:</text>
    <g transform="translate(15,214)">
      <g font-size="11" fill="#9ca3af">
        <text x="20" y="0" text-anchor="middle">0</text>
        <text x="60" y="0" text-anchor="middle">1</text>
        <text x="100" y="0" text-anchor="middle">2</text>
        <text x="140" y="0" text-anchor="middle">3</text>
        <text x="180" y="0" text-anchor="middle">4</text>
        <text x="220" y="0" text-anchor="middle">5</text>
      </g>
      <rect x="4" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="20" y="31" text-anchor="middle" font-size="14" fill="#374151">1</text>
      <rect x="44" y="10" width="32" height="32" rx="4" fill="#50C878" />
      <text x="60" y="31" text-anchor="middle" font-size="13" fill="#fff">&#8722;2</text>
      <rect x="84" y="10" width="32" height="32" rx="4" fill="#4A90D9" />
      <text x="100" y="31" text-anchor="middle" font-size="13" fill="#fff">&#8722;1</text>
      <rect x="124" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="140" y="31" text-anchor="middle" font-size="14" fill="#374151">1</text>
      <rect x="164" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="180" y="31" text-anchor="middle" font-size="14" fill="#374151">2</text>
      <rect x="204" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="220" y="31" text-anchor="middle" font-size="14" fill="#374151">1</text>
    </g>
    <rect x="15" y="270" width="240" height="80" rx="6" fill="#FFF7ED" />
    <text x="135" y="290" text-anchor="middle" font-size="11.5" fill="#9a3412" font-weight="700">Untouched (grey) positions keep</text>
    <text x="135" y="306" text-anchor="middle" font-size="11.5" fill="#9a3412">their original non-negative value</text>
    <text x="135" y="322" text-anchor="middle" font-size="11.5" fill="#9a3412">&#8212; that's how "C" is recovered</text>
    <text x="135" y="338" text-anchor="middle" font-size="11.5" fill="#9a3412">without ever being tracked.</text>
  </g>
  <!-- ============ PANEL 3: print with the swap ============ -->
  <g transform="translate(610,80)">
    <rect x="0" y="0" width="270" height="440" rx="10" fill="#FAFAFA" stroke="#e5e7eb" />
    <text x="135" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Step 3 &#8212; print the letters</text>
    <text x="135" y="44" text-anchor="middle" font-size="11" fill="#6b7280">i&lt;&#8722;1 ? 'A' : i&lt;0 ? 'B' : 'C'</text>
    <g transform="translate(15,58)">
      <rect x="4" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="20" y="31" text-anchor="middle" font-size="14" fill="#374151">1</text>
      <rect x="44" y="10" width="32" height="32" rx="4" fill="#50C878" />
      <text x="60" y="31" text-anchor="middle" font-size="13" fill="#fff">&#8722;2</text>
      <rect x="84" y="10" width="32" height="32" rx="4" fill="#4A90D9" />
      <text x="100" y="31" text-anchor="middle" font-size="13" fill="#fff">&#8722;1</text>
      <rect x="124" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="140" y="31" text-anchor="middle" font-size="14" fill="#374151">1</text>
      <rect x="164" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="180" y="31" text-anchor="middle" font-size="14" fill="#374151">2</text>
      <rect x="204" y="10" width="32" height="32" rx="4" fill="#e5e7eb" />
      <text x="220" y="31" text-anchor="middle" font-size="14" fill="#374151">1</text>
      <!-- arrows down to letters -->
      <line x1="20" y1="46" x2="20" y2="70" stroke="#9ca3af" stroke-width="1.5" />
      <line x1="60" y1="46" x2="60" y2="70" stroke="#F5A623" stroke-width="1.5" stroke-dasharray="3,3" />
      <line x1="100" y1="46" x2="100" y2="70" stroke="#50C878" stroke-width="1.5" stroke-dasharray="3,3" />
      <line x1="140" y1="46" x2="140" y2="70" stroke="#9ca3af" stroke-width="1.5" />
      <line x1="180" y1="46" x2="180" y2="70" stroke="#9ca3af" stroke-width="1.5" />
      <line x1="220" y1="46" x2="220" y2="70" stroke="#9ca3af" stroke-width="1.5" />
      <rect x="4" y="70" width="32" height="32" rx="4" fill="#F5A623" />
      <text x="20" y="91" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">C</text>
      <rect x="44" y="70" width="32" height="32" rx="4" fill="#4A90D9" />
      <text x="60" y="91" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">A</text>
      <rect x="84" y="70" width="32" height="32" rx="4" fill="#50C878" />
      <text x="100" y="91" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">B</text>
      <rect x="124" y="70" width="32" height="32" rx="4" fill="#F5A623" />
      <text x="140" y="91" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">C</text>
      <rect x="164" y="70" width="32" height="32" rx="4" fill="#F5A623" />
      <text x="180" y="91" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">C</text>
      <rect x="204" y="70" width="32" height="32" rx="4" fill="#F5A623" />
      <text x="220" y="91" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">C</text>
    </g>
    <rect x="15" y="180" width="240" height="90" rx="6" fill="#FEF2F2" />
    <text x="135" y="200" text-anchor="middle" font-size="11.5" fill="#991b1b" font-weight="700">The label swap, visualized:</text>
    <text x="135" y="218" text-anchor="middle" font-size="11" fill="#991b1b">&#8722;2 (from bb, "B's" sentinel)</text>
    <text x="135" y="234" text-anchor="middle" font-size="11" fill="#991b1b">prints as letter 'A' &#8212; and</text>
    <text x="135" y="250" text-anchor="middle" font-size="11" fill="#991b1b">&#8722;1 (from aa, "A's" sentinel)</text>
    <text x="135" y="266" text-anchor="middle" font-size="11" fill="#991b1b">prints as letter 'B'. Harmless.</text>
    <rect x="15" y="284" width="240" height="60" rx="6" fill="#F0FDF4" />
    <text x="135" y="306" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">Final output: "CABCCC"</text>
    <text x="135" y="324" text-anchor="middle" font-size="11" fill="#166534">&#8212; matches the real judge run</text>
  </g>
</svg>