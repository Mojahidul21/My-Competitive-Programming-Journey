<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect x="0" y="0" width="700" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">
    The Balance Condition: MEX(A)+MEX(B)+MEX(C) &#8805; 2&#215;max(MEX)
  </text>

  <!-- ===== Left block: individual mex bars ===== -->
  <text x="150" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Individual MEX values</text>

  <!-- axis line -->
  <line x1="60" y1="330" x2="260" y2="330" stroke="#9ca3af" stroke-width="2"/>

  <!-- Bar A: mex = 2 -->
  <rect x="70" y="210" width="45" height="120" fill="#4A90D9" rx="4"/>
  <text x="92" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#4A90D9">2</text>
  <text x="92" y="350" text-anchor="middle" font-size="13" fill="#374151">A</text>

  <!-- Bar B: mex = 2 -->
  <rect x="135" y="210" width="45" height="120" fill="#50C878" rx="4"/>
  <text x="157" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#2f9e5e">2</text>
  <text x="157" y="350" text-anchor="middle" font-size="13" fill="#374151">B</text>

  <!-- Bar C: mex = 0 -->
  <rect x="200" y="322" width="45" height="8" fill="#F5A623" rx="2"/>
  <text x="222" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#c67c0b">0</text>
  <text x="222" y="350" text-anchor="middle" font-size="13" fill="#374151">C</text>

  <text x="150" y="380" text-anchor="middle" font-size="12" fill="#6b7280">(one valid split of {0,1,1,0,1,2})</text>

  <!-- Divider -->
  <line x1="330" y1="60" x2="330" y2="400" stroke="#e5e7eb" stroke-width="2"/>

  <!-- ===== Right block: sum vs threshold comparison ===== -->
  <text x="520" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Sum vs. threshold</text>

  <line x1="400" y1="330" x2="640" y2="330" stroke="#9ca3af" stroke-width="2"/>

  <!-- Sum bar: 2+2+0 = 4 -->
  <rect x="420" y="130" width="70" height="200" fill="#7C3AED" rx="4"/>
  <text x="455" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">4</text>
  <text x="455" y="350" text-anchor="middle" font-size="13" fill="#374151">Sum</text>

  <!-- 2*max bar: 2*2 = 4 -->
  <rect x="530" y="130" width="70" height="200" fill="#DC2626" rx="4" opacity="0.85"/>
  <text x="565" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626">4</text>
  <text x="565" y="350" text-anchor="middle" font-size="13" fill="#374151">2 &#215; max</text>

  <!-- threshold dashed line -->
  <line x1="400" y1="130" x2="640" y2="130" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- checkmark -->
  <circle cx="520" cy="90" r="16" fill="#16A34A"/>
  <text x="520" y="96" text-anchor="middle" font-size="18" fill="#ffffff" font-weight="700">&#10003;</text>
  <text x="520" y="380" text-anchor="middle" font-size="12" fill="#6b7280">4 &#8805; 4 &#8594; condition holds</text>

  <!-- Bottom takeaway strip -->
  <rect x="40" y="410" width="620" height="40" rx="8" fill="#F3F4F6"/>
  <text x="350" y="435" text-anchor="middle" font-size="13.5" fill="#374151">
    The largest MEX can never outrun the combined "help" of the other two &#8212; that's the whole game.
  </text>
</svg>
