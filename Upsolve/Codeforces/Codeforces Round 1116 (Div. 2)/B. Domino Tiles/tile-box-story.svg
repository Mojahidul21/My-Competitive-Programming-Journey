<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1035"/>
      <stop offset="55%" stop-color="#2c1a52"/>
      <stop offset="100%" stop-color="#4a2e6b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a34"/>
      <stop offset="100%" stop-color="#5e3b1f"/>
    </linearGradient>
    <radialGradient id="wingGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe9ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bfe9ff" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="900" height="420" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff6d8">
    <circle cx="60" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="140" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="220" cy="35" r="1.8" opacity="0.9"/>
    <circle cx="320" cy="70" r="1.3" opacity="0.7"/>
    <circle cx="410" cy="30" r="1.5" opacity="0.8"/>
    <circle cx="500" cy="60" r="1.1" opacity="0.5"/>
    <circle cx="600" cy="25" r="1.7" opacity="0.9"/>
    <circle cx="700" cy="55" r="1.3" opacity="0.6"/>
    <circle cx="800" cy="45" r="1.5" opacity="0.8"/>
    <circle cx="850" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="30" cy="130" r="1.1" opacity="0.5"/>
    <circle cx="480" cy="100" r="1.2" opacity="0.6"/>
  </g>

  <!-- moon -->
  <circle cx="760" cy="80" r="80" fill="url(#moonGlow)"/>
  <circle cx="760" cy="80" r="34" fill="#fff6d8"/>

  <!-- distant hill -->
  <path d="M0,260 Q220,210 450,250 T900,240 L900,420 L0,420 Z" fill="#241640"/>

  <!-- table -->
  <rect x="0" y="330" width="900" height="90" fill="url(#wood)"/>
  <rect x="0" y="330" width="900" height="6" fill="#a97a49"/>

  <!-- row of tiles: 8 tiles, two shown faded (the '?' marks) -->
  <!-- tile template repeated with different fill/text -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">
    <!-- tile 1: 0 -->
    <g transform="translate(190,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#3a2415" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="#3a2415"/>
    </g>
    <!-- tile 2: 1 -->
    <g transform="translate(270,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#3a2415" stroke-width="3"/>
      <circle cx="-12" cy="0" r="9" fill="#3a2415"/>
      <circle cx="12" cy="0" r="9" fill="#3a2415"/>
    </g>
    <!-- tile 3: faded ? -->
    <g transform="translate(350,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#8a7a63" stroke-width="3" opacity="0.45"/>
      <text x="0" y="12" font-size="34" fill="#8a7a63" opacity="0.7">?</text>
    </g>
    <!-- tile 4: 1 -->
    <g transform="translate(430,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#3a2415" stroke-width="3"/>
      <circle cx="-12" cy="0" r="9" fill="#3a2415"/>
      <circle cx="12" cy="0" r="9" fill="#3a2415"/>
    </g>
    <!-- tile 5: 0 -->
    <g transform="translate(510,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#3a2415" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="#3a2415"/>
    </g>
    <!-- tile 6: faded ? -->
    <g transform="translate(590,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#8a7a63" stroke-width="3" opacity="0.45"/>
      <text x="0" y="12" font-size="34" fill="#8a7a63" opacity="0.7">?</text>
    </g>
    <!-- tile 7: 0 -->
    <g transform="translate(670,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#3a2415" stroke-width="3"/>
      <circle cx="0" cy="0" r="9" fill="#3a2415"/>
    </g>
    <!-- tile 8: 1 -->
    <g transform="translate(750,300)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f4ead2" stroke="#3a2415" stroke-width="3"/>
      <circle cx="-12" cy="0" r="9" fill="#3a2415"/>
      <circle cx="12" cy="0" r="9" fill="#3a2415"/>
    </g>
  </g>

  <!-- a small potted plant for warmth -->
  <g transform="translate(90,300)">
    <rect x="-14" y="10" width="28" height="26" rx="4" fill="#7a4a2b"/>
    <path d="M0,10 C-18,-10 -22,-40 0,-55 C22,-40 18,-10 0,10 Z" fill="#3f7a4e"/>
  </g>

  <!-- fairy: original silhouette design, not tied to any existing character -->
  <g transform="translate(300,160)">
    <!-- sparkle trail -->
    <circle cx="70" cy="70" r="2.5" fill="#fff6d8" opacity="0.8"/>
    <circle cx="90" cy="90" r="2" fill="#fff6d8" opacity="0.6"/>
    <circle cx="105" cy="105" r="1.6" fill="#fff6d8" opacity="0.4"/>

    <!-- wings -->
    <ellipse cx="-16" cy="-4" rx="22" ry="14" fill="url(#wingGrad)" transform="rotate(-20 -16 -4)"/>
    <ellipse cx="16" cy="-4" rx="22" ry="14" fill="url(#wingGrad)" transform="rotate(20 16 -4)"/>

    <!-- body -->
    <path d="M0,-10 C10,-10 12,6 6,18 C3,26 -3,26 -6,18 C-12,6 -10,-10 0,-10 Z" fill="#e7c9f0"/>
    <!-- head -->
    <circle cx="0" cy="-18" r="10" fill="#f6e4c8"/>
    <!-- tiny antenna sparks -->
    <circle cx="-5" cy="-30" r="1.6" fill="#fff6d8"/>
    <circle cx="5" cy="-30" r="1.6" fill="#fff6d8"/>
    <line x1="-5" y1="-27" x2="-4" y2="-22" stroke="#fff6d8" stroke-width="1"/>
    <line x1="5" y1="-27" x2="4" y2="-22" stroke="#fff6d8" stroke-width="1"/>

    <!-- wand with a faint glow, pointed at the faded tile -->
    <line x1="14" y1="10" x2="46" y2="34" stroke="#f6e4c8" stroke-width="2"/>
    <circle cx="46" cy="34" r="4" fill="#fff6d8"/>
    <circle cx="46" cy="34" r="9" fill="#fff6d8" opacity="0.25"/>
  </g>

  <!-- caption plate -->
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="450" y="40" text-anchor="middle" font-size="22" fill="#f4ead2" opacity="0.9">
      A box of fading tiles, and two marks left for the fairy to guess
    </text>
  </g>
</svg>
