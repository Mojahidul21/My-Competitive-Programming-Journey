<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="560" fill="#0b1020"/>
  <text x="500" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#a5b4fc">Step 1 · Read a_k = m as two rules</text>
  <text x="500" y="78" text-anchor="middle" font-size="18" fill="#94a3b8">Example: n = 10, k = 3, a_3 = 2. Cut 0..9 into blocks of width 3.</text>

  <!-- floor values -->
  <text x="60" y="132" font-size="15" fill="#94a3b8">floor(y / 3)</text>
  <g font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">
    <text x="190" y="132">0</text><text x="270" y="132">0</text><text x="350" y="132">0</text>
    <text x="430" y="132">1</text><text x="510" y="132">1</text><text x="590" y="132">1</text>
    <text x="670" y="132">2</text><text x="750" y="132">2</text><text x="830" y="132">2</text>
    <text x="910" y="132">3</text>
  </g>

  <!-- cells -->
  <text x="60" y="190" font-size="15" fill="#94a3b8">index y</text>
  <g font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="154" y="150" width="72" height="56" rx="10" fill="#16a34a"/><text x="190" y="187">0</text>
    <rect x="234" y="150" width="72" height="56" rx="10" fill="#16a34a"/><text x="270" y="187">1</text>
    <rect x="314" y="150" width="72" height="56" rx="10" fill="#16a34a"/><text x="350" y="187">2</text>
    <rect x="394" y="150" width="72" height="56" rx="10" fill="#16a34a"/><text x="430" y="187">3</text>
    <rect x="474" y="150" width="72" height="56" rx="10" fill="#16a34a"/><text x="510" y="187">4</text>
    <rect x="554" y="150" width="72" height="56" rx="10" fill="#16a34a"/><text x="590" y="187">5</text>
    <rect x="634" y="150" width="72" height="56" rx="10" fill="#e11d48"/><text x="670" y="187">6</text>
    <rect x="714" y="150" width="72" height="56" rx="10" fill="#e11d48"/><text x="750" y="187">7</text>
    <rect x="794" y="150" width="72" height="56" rx="10" fill="#e11d48"/><text x="830" y="187">8</text>
    <rect x="874" y="150" width="72" height="56" rx="10" fill="#475569"/><text x="910" y="187">9</text>
  </g>

  <!-- block brackets -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 154 222 L 154 234 L 386 234 L 386 222" stroke="#4ade80"/>
    <path d="M 394 222 L 394 234 L 626 234 L 626 222" stroke="#4ade80"/>
    <path d="M 634 222 L 634 234 L 866 234 L 866 222" stroke="#fb7185"/>
    <path d="M 874 222 L 874 234 L 946 234 L 946 222" stroke="#94a3b8"/>
  </g>
  <g font-size="16" font-weight="600" text-anchor="middle">
    <text x="270" y="260" fill="#4ade80">block 0 = [0, 2]</text>
    <text x="510" y="260" fill="#4ade80">block 1 = [3, 5]</text>
    <text x="750" y="260" fill="#fb7185">block 2 = [6, 8]</text>
    <text x="910" y="260" fill="#94a3b8">block 3</text>
  </g>

  <!-- rules -->
  <rect x="60" y="300" width="880" height="64" rx="14" fill="#14532d"/>
  <text x="84" y="328" font-size="19" font-weight="700" fill="#bbf7d0">Rule 1 · presence</text>
  <text x="84" y="352" font-size="17" fill="#dcfce7">Blocks 0 .. a_k − 1 (here blocks 0 and 1) must each contain at least one element of B.</text>

  <rect x="60" y="376" width="880" height="64" rx="14" fill="#881337"/>
  <text x="84" y="404" font-size="19" font-weight="700" fill="#fecdd3">Rule 2 · absence</text>
  <text x="84" y="428" font-size="17" fill="#ffe4e6">Block a_k (here block 2 = [k·a_k, k·a_k + k − 1] = [6, 8]) must contain nothing from B.</text>

  <rect x="60" y="452" width="880" height="40" rx="14" fill="#1e293b"/>
  <text x="84" y="478" font-size="17" fill="#cbd5e1">Blocks after block a_k (here block 3) have no rule.</text>

  <text x="500" y="526" text-anchor="middle" font-size="19" font-weight="700" fill="#facc15">Adding elements can never break Rule 1. Only Rule 2 can be broken.</text>
</svg>
