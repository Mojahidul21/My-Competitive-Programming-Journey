<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="560" fill="#0b1020"/>
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#a5b4fc">Sort and merge: one pass, one invariant</text>
  <text x="500" y="72" text-anchor="middle" font-size="16" fill="#94a3b8">Sample 3 ranges after sorting: (1,1) (3,5) (4,5) (4,5) (5,5)</text>

  <!-- index header -->
  <g font-size="16" font-weight="700" fill="#e2e8f0" text-anchor="middle">
    <text x="90" y="114">0</text><text x="160" y="114">1</text><text x="230" y="114">2</text>
    <text x="300" y="114">3</text><text x="370" y="114">4</text><text x="440" y="114">5</text>
  </g>
  <g fill="#1e293b">
    <rect x="58" y="122" width="64" height="10" rx="5"/><rect x="128" y="122" width="64" height="10" rx="5"/>
    <rect x="198" y="122" width="64" height="10" rx="5"/><rect x="268" y="122" width="64" height="10" rx="5"/>
    <rect x="338" y="122" width="64" height="10" rx="5"/><rect x="408" y="122" width="64" height="10" rx="5"/>
  </g>

  <!-- range bars (sorted order) -->
  <g font-size="15" font-weight="700" fill="#0b1020">
    <rect x="128" y="150" width="64" height="34" rx="8" fill="#fb7185"/><text x="138" y="173">(1,1)</text>
    <rect x="268" y="200" width="204" height="34" rx="8" fill="#c084fc"/><text x="278" y="223">(3,5)</text>
    <rect x="338" y="250" width="134" height="34" rx="8" fill="#818cf8"/><text x="348" y="273">(4,5)</text>
    <rect x="338" y="300" width="134" height="34" rx="8" fill="#818cf8"/><text x="348" y="323">(4,5)</text>
    <rect x="408" y="350" width="64" height="34" rx="8" fill="#60a5fa"/><text x="418" y="373">(5,5)</text>
  </g>

  <!-- decisions -->
  <g font-size="16" fill="#e2e8f0">
    <text x="520" y="173">start: block = [1, 1]</text>
    <text x="520" y="223">3 &gt; 1, a gap. Paint [1, 1]. New block = [3, 5]</text>
    <text x="520" y="273">4 &#8804; 5, overlap. r = max(5, 5) = 5</text>
    <text x="520" y="323">4 &#8804; 5, overlap. r stays 5</text>
    <text x="520" y="373">5 &#8804; 5, overlap. r stays 5</text>
  </g>
  <line x1="40" y1="402" x2="960" y2="402" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="520" y="432" font-size="16" fill="#e2e8f0">loop ends. The last block is still open, so paint [3, 5] now.</text>

  <!-- result row -->
  <g font-size="18" font-weight="800" fill="#fff" text-anchor="middle">
    <rect x="58" y="446" width="64" height="40" rx="9" fill="#16a34a"/><text x="90" y="473">0</text>
    <rect x="128" y="446" width="64" height="40" rx="9" fill="#e11d48"/><text x="160" y="473">1</text>
    <rect x="198" y="446" width="64" height="40" rx="9" fill="#16a34a"/><text x="230" y="473">2</text>
    <rect x="268" y="446" width="64" height="40" rx="9" fill="#e11d48"/><text x="300" y="473">3</text>
    <rect x="338" y="446" width="64" height="40" rx="9" fill="#e11d48"/><text x="370" y="473">4</text>
    <rect x="408" y="446" width="64" height="40" rx="9" fill="#e11d48"/><text x="440" y="473">5</text>
  </g>
  <text x="520" y="473" font-size="17" font-weight="700" fill="#4ade80">B* = {0, 2}</text>

  <rect x="40" y="504" width="920" height="40" rx="12" fill="#1e293b"/>
  <text x="500" y="530" text-anchor="middle" font-size="16" fill="#facc15">Invariant: [l, r] is the merged block of every range seen so far; earlier blocks are already painted.</text>
</svg>
