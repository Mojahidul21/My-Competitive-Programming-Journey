<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#0b1020" />
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="800" fill="#a5b4fc">Detect TLE before Getting WA</text>
  <g>
    <rect x="20" y="80" width="210" height="220" rx="16" fill="#1e293b" />
    <rect x="270" y="80" width="210" height="220" rx="16" fill="#1e293b" />
    <rect x="520" y="80" width="210" height="220" rx="16" fill="#1e293b" />
    <rect x="770" y="80" width="210" height="220" rx="16" fill="#14532d" />
  </g>
  <g font-size="20" font-weight="800">
    <text x="40" y="116" fill="#38bdf8">1. Doubt</text>
    <text x="290" y="116" fill="#c084fc">2. Calculate</text>
    <text x="540" y="116" fill="#facc15">3. Compare</text>
    <text x="790" y="116" fill="#4ade80">4. Remedy</text>
  </g>
  <g font-size="16" fill="#e2e8f0">
    <text x="40" y="154">Inner loop length</text>
    <text x="40" y="176">depends on the outer</text>
    <text x="40" y="198">index k (up to k steps)</text>
    <text x="40" y="232" fill="#94a3b8">Paints ranges with no</text>
    <text x="40" y="254" fill="#94a3b8">memory of old paint.</text>
    <text x="290" y="154">Write cost as a sum.</text>
    <text x="290" y="176">Pick the worst valid</text>
    <text x="290" y="198">input (small a_k).</text>
    <text x="290" y="232" fill="#c084fc">sum of k = n(n+1)/2</text>
    <text x="290" y="254" fill="#c084fc">= about 5 · 10^9</text>
    <text x="540" y="154">Budget in 2 seconds:</text>
    <text x="540" y="176">about 10^8 to 10^9</text>
    <text x="540" y="198">simple steps.</text>
    <text x="540" y="232" fill="#facc15">5 · 10^9 is far over</text>
    <text x="540" y="254" fill="#facc15">budget: expect TLE.</text>
    <text x="790" y="154">Touch each cell O(1)</text>
    <text x="790" y="176">times in total.</text>
    <text x="790" y="198">Sort and merge ranges,</text>
    <text x="790" y="220">paint each block once.</text>
    <text x="790" y="254" fill="#4ade80">O(n log n)</text>
  </g>
  <g stroke="#94a3b8" stroke-width="3" marker-end="url(#ah)">
    <line x1="232" y1="190" x2="266" y2="190" />
    <line x1="482" y1="190" x2="516" y2="190" />
    <line x1="732" y1="190" x2="766" y2="190" />
  </g>
  <text x="500" y="344" text-anchor="middle" font-size="19" font-weight="700" fill="#facc15">Do this before pressing Submit, not after the verdict.</text>
</svg>
