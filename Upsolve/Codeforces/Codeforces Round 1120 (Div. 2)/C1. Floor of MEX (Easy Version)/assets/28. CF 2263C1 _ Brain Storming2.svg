<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="680" fill="#0b1020" />
  <text x="500" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#a5b4fc">Step 2 · Collect the bans, keep the rest</text>
  <text x="500" y="78" text-anchor="middle" font-size="18" fill="#94a3b8">Sample 3: n = 6, a = [1, 2, 1, 1, 1, 1]. Each k bans the block [k·a_k, k·a_k + k − 1].</text>
  <!-- index header -->
  <g font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle">
    <text x="350" y="130">0</text>
    <text x="450" y="130">1</text>
    <text x="550" y="130">2</text>
    <text x="650" y="130">3</text>
    <text x="750" y="130">4</text>
    <text x="850" y="130">5</text>
  </g>
  <g fill="#1e293b">
    <rect x="304" y="140" width="92" height="12" rx="6" />
    <rect x="404" y="140" width="92" height="12" rx="6" />
    <rect x="504" y="140" width="92" height="12" rx="6" />
    <rect x="604" y="140" width="92" height="12" rx="6" />
    <rect x="704" y="140" width="92" height="12" rx="6" />
    <rect x="804" y="140" width="92" height="12" rx="6" />
  </g>
  <!-- lanes -->
  <g font-size="17" fill="#cbd5e1">
    <text x="40" y="196">k = 1, a = 1</text>
    <text x="40" y="256">k = 2, a = 2</text>
    <text x="40" y="316">k = 3, a = 1</text>
    <text x="40" y="376">k = 4, a = 1</text>
    <text x="40" y="436">k = 5, a = 1</text>
    <text x="40" y="496">k = 6, a = 1</text>
  </g>
  <g font-size="16" font-weight="700" fill="#0b1020">
    <rect x="404" y="170" width="92" height="38" rx="9" fill="#fb7185" />
    <text x="414" y="195">[1, 1]</text>
    <rect x="704" y="230" width="192" height="38" rx="9" fill="#f472b6" />
    <text x="714" y="255">[4, 5]</text>
    <rect x="604" y="290" width="292" height="38" rx="9" fill="#c084fc" />
    <text x="614" y="315">[3, 5]</text>
    <rect x="704" y="350" width="192" height="38" rx="9" fill="#818cf8" />
    <text x="714" y="375">[4, 5]</text>
    <rect x="804" y="410" width="92" height="38" rx="9" fill="#60a5fa" />
    <text x="814" y="435">[5, 5]</text>
  </g>
  <g font-size="14" fill="#94a3b8" text-anchor="end">
    <text x="696" y="375">[4, 7] clipped</text>
    <text x="796" y="435">[5, 9] clipped</text>
  </g>
  <text x="304" y="496" font-size="17" fill="#94a3b8">l = 6 ≥ n = 6, so the block is outside the array: skipped</text>
  <!-- union -->
  <text x="40" y="580" font-size="18" font-weight="700" fill="#facc15">union of bans</text>
  <g font-size="22" font-weight="800" fill="#fff" text-anchor="middle">
    <rect x="304" y="552" width="92" height="46" rx="10" fill="#16a34a" />
    <text x="350" y="583">0</text>
    <rect x="404" y="552" width="92" height="46" rx="10" fill="#e11d48" />
    <text x="450" y="583">1</text>
    <rect x="504" y="552" width="92" height="46" rx="10" fill="#16a34a" />
    <text x="550" y="583">2</text>
    <rect x="604" y="552" width="92" height="46" rx="10" fill="#e11d48" />
    <text x="650" y="583">3</text>
    <rect x="704" y="552" width="92" height="46" rx="10" fill="#e11d48" />
    <text x="750" y="583">4</text>
    <rect x="804" y="552" width="92" height="46" rx="10" fill="#e11d48" />
    <text x="850" y="583">5</text>
  </g>
  <text x="500" y="640" text-anchor="middle" font-size="22" font-weight="800" fill="#4ade80">Forbidden = {1, 3, 4, 5} → B* = {0, 2}</text>
  <text x="500" y="666" text-anchor="middle" font-size="15" fill="#94a3b8">This matches the sample output: 2 / 0 2</text>
</svg>
