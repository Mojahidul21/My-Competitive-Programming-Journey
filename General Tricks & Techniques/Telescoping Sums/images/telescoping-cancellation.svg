<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<circle cx="90" cy="60" r="5" fill="#20242c"/>
<text x="90" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#20242c">a[1]</text>
<circle cx="220" cy="60" r="5" fill="#20242c"/>
<text x="220" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#20242c">a[2]</text>
<circle cx="350" cy="60" r="5" fill="#20242c"/>
<text x="350" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#20242c">a[3]</text>
<circle cx="480" cy="60" r="5" fill="#20242c"/>
<text x="480" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#20242c">a[4]</text>
<circle cx="610" cy="60" r="5" fill="#20242c"/>
<text x="610" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="#20242c">a[n]</text>
<text x="545.0" y="66" text-anchor="middle" font-size="20" fill="#8a8f98">···</text>
<path d="M 90 60 Q 155.0 115 220 60" stroke="#8a8f98" stroke-width="2" fill="none"/>
<text x="155.0" y="130" text-anchor="middle" font-size="13" fill="#20242c">b1=a[2]−a[1]</text>
<path d="M 220 60 Q 285.0 115 350 60" stroke="#8a8f98" stroke-width="2" fill="none"/>
<text x="285.0" y="130" text-anchor="middle" font-size="13" fill="#20242c">b2=a[3]−a[2]</text>
<path d="M 350 60 Q 415.0 115 480 60" stroke="#8a8f98" stroke-width="2" fill="none"/>
<text x="415.0" y="130" text-anchor="middle" font-size="13" fill="#20242c">b3=a[4]−a[3]</text>
<text x="340.0" y="170" text-anchor="middle" font-size="18" fill="#20242c">
</text>
<text x="340.0" y="170" text-anchor="middle" font-size="17"><tspan fill="#c62828">−a[1]</tspan> <tspan fill="#8a8f98">+</tspan> <tspan fill="#1565c0">(a[2]−a[2])</tspan> <tspan fill="#8a8f98">+</tspan> <tspan fill="#1565c0">(a[3]−a[3])</tspan> <tspan fill="#8a8f98">+ ··· +</tspan> <tspan fill="#2e7d32">a[n]</tspan></text>
<text x="340.0" y="204" text-anchor="middle" font-size="15" fill="#20242c" opacity="0.75">every interior term appears once with + and once with − → cancels</text>
<text x="340.0" y="238" text-anchor="middle" font-size="20" font-weight="700" fill="#20242c">b1 + b2 + ··· + b(n−1) = <tspan fill="#2e7d32">a[n]</tspan> − <tspan fill="#c62828">a[1]</tspan></text>
</svg>