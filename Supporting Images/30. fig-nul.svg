<defs><style>@keyframes cur{0%{transform:translateX(0)}33.3%{transform:translateX(130px)}66.6%,100%{transform:translateX(260px)}}@keyframes n0{0%,33.2%{opacity:1}33.3%,100%{opacity:0}}@keyframes n1{0%,33.2%{opacity:0}33.3%,66.5%{opacity:1}66.6%,100%{opacity:0}}@keyframes n2{0%,66.5%{opacity:0}66.6%,100%{opacity:1}}.cur{animation:cur 6s steps(1,end) infinite}.n0{animation:n0 6s steps(1,end) infinite}.n1{animation:n1 6s steps(1,end) infinite}.n2{animation:n2 6s steps(1,end) infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style></defs>
