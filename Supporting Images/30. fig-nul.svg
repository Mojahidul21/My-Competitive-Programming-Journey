610" stroke="#FFC83D" stroke-width="3"/><text x="430" y="258" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" text-anchor="middle" >sizeof word = 3</text><g class="cur"><polygon points="305,98 295,84 315,84" fill="#FFC83D"/></g><text x="60" y="150" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="400" text-anchor="start" >count so far:</text><text x="60" y="176" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" text-anchor="start" class="n0">0</text><text x="60" y="176" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" text-anchor="start" class="n1">1</text><text x="60" y="176" fill="#FF8A1F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" text-anchor="start" class="n2">2  stop at &#x27;\0&#x27;</text>
