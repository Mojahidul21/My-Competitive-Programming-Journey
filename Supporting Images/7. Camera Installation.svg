<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky2" cx="50%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="100%" stop-color="#0b0f1f"/>
    </radialGradient>
    <radialGradient id="moonGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="760" height="460" fill="url(#sky2)"/>

  <g fill="#e8ecff">
    <circle cx="50" cy="35" r="1.5"/>
    <circle cx="110" cy="80" r="1.2"/>
    <circle cx="700" cy="40" r="1.6"/>
    <circle cx="660" cy="110" r="1.2"/>
    <circle cx="30" cy="200" r="1.3"/>
    <circle cx="730" cy="220" r="1.4"/>
  </g>

  <circle cx="670" cy="55" r="55" fill="url(#moonGlow2)"/>
  <circle cx="670" cy="55" r="22" fill="#f5efd6"/>
  <circle cx="678" cy="48" r="3.5" fill="#d8d0ad" opacity="0.6"/>

  <text x="380" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#f2f3ff">2257C — Spying on the Beaver</text>
  <text x="380" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#a9b0d6">n=6, parents [1,2,2,1,1], dams = {1, 3, 5}</text>

  <!-- edges -->
  <g stroke="#5a6290" stroke-width="3">
    <line x1="380" y1="100" x2="230" y2="180"/> <!-- 1-2 -->
    <line x1="380" y1="100" x2="380" y2="180"/> <!-- 1-5 -->
    <line x1="380" y1="100" x2="530" y2="180"/> <!-- 1-6 -->
    <line x1="230" y1="180" x2="150" y2="270"/> <!-- 2-3 -->
    <line x1="230" y1="180" x2="300" y2="270"/> <!-- 2-4 -->
  </g>

  <!-- camera on edge 2-3 (above vertex 3) -->
  <g filter="url(#soft2)">
    <circle cx="190" cy="225" r="12" fill="#ffd166" opacity="0.35"/>
  </g>
  <rect x="176" y="213" width="28" height="22" rx="4" fill="#ffd166"/>
  <circle cx="190" cy="224" r="5.5" fill="#3a2e0a"/>

  <!-- camera on edge 1-5 (above vertex 5) -->
  <g filter="url(#soft2)">
    <circle cx="380" cy="140" r="12" fill="#ffd166" opacity="0.35"/>
  </g>
  <rect x="366" y="128" width="28" height="22" rx="4" fill="#ffd166"/>
  <circle cx="380" cy="139" r="5.5" fill="#3a2e0a"/>

  <!-- nodes -->
  <g font-family="Georgia, serif" font-size="15" text-anchor="middle">
    <circle cx="380" cy="100" r="26" fill="#2c3560" stroke="#9fe0a8" stroke-width="3"/>
    <text x="380" y="106" fill="#eef1ff">1</text>

    <circle cx="230" cy="180" r="24" fill="#2c3560" stroke="#6c76a8" stroke-width="2"/>
    <text x="230" y="186" fill="#eef1ff">2</text>

    <circle cx="530" cy="180" r="24" fill="#2c3560" stroke="#6c76a8" stroke-width="2"/>
    <text x="530" y="186" fill="#eef1ff">6</text>

    <circle cx="150" cy="270" r="24" fill="#2c3560" stroke="#ffd166" stroke-width="3"/>
    <text x="150" y="276" fill="#eef1ff">3</text>

    <circle cx="300" cy="270" r="22" fill="#2c3560" stroke="#6c76a8" stroke-width="2"/>
    <text x="300" y="276" fill="#eef1ff">4</text>

    <circle cx="380" cy="180" r="24" fill="#2c3560" stroke="#ffd166" stroke-width="3"/>
    <text x="380" y="186" fill="#eef1ff">5</text>
  </g>

  <!-- labels -->
  <g font-family="Georgia, serif" font-size="12" fill="#c9cdea">
    <text x="380" y="72" text-anchor="middle" fill="#9fe0a8">dam, silent (smallest — safe to leave unmarked)</text>
    <text x="150" y="315" text-anchor="middle">dam · signal {above 3}</text>
    <text x="380" y="215" text-anchor="middle">dam · signal {above 5}</text>
  </g>

  <text x="380" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a9b0d6">
    Reaching 1: empty signal. Reaching 3: {above 3}. Reaching 5: {above 5}. All distinct — k = 2 = m − 1.
  </text>
  <text x="380" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7d84ab">
    Vertices 2, 4, 6 carry no dam and need no camera.
  </text>
</svg>
