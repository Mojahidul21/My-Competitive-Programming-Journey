<svg viewBox="0 0 760 540" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Camera Eye on the Beaver!</title>
  <desc>Loop showing the Beaver traveling from the root to dam 1 (no camera fires), then to dam 3 (camera above 3 fires), then to dam 5 (camera above 5 fires), repeating every 9 seconds.</desc>
  <style>
    @keyframes beaverMove {
      0%   { transform: translate(0px,0px); }
      4%   { transform: translate(0px,0px); }
      9%   { transform: translate(0px,0px); }
      30%  { transform: translate(0px,0px); }
      36%  { transform: translate(-230px,170px); }
      46%  { transform: translate(-230px,170px); }
      56%  { transform: translate(0px,0px); }
      63%  { transform: translate(0px,0px); }
      69%  { transform: translate(0px,80px); }
      79%  { transform: translate(0px,80px); }
      89%  { transform: translate(0px,0px); }
      100% { transform: translate(0px,0px); }
    }
    @keyframes rootPulse {
      0%   { opacity: 0; }
      2%   { opacity: 0.75; }
      8%   { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes cam3Glow {
      0%, 32% { opacity: 0; }
      36%     { opacity: 1; }
      46%     { opacity: 1; }
      53%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    @keyframes cam5Glow {
      0%, 66% { opacity: 0; }
      69%     { opacity: 1; }
      79%     { opacity: 1; }
      86%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    .beaver-token { animation: beaverMove 9s ease-in-out infinite; }
    .root-pulse   { animation: rootPulse 9s ease-in-out infinite; }
    .cam3-glow    { animation: cam3Glow 9s ease-in-out infinite; }
    .cam5-glow    { animation: cam5Glow 9s ease-in-out infinite; }
    text { font-family: Georgia, serif; }
  </style>

  <defs>
    <radialGradient id="sky3" cx="50%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="100%" stop-color="#0b0f1f"/>
    </radialGradient>
  </defs>

  <rect width="760" height="540" fill="url(#sky3)"/>

  <text x="380" y="40" text-anchor="middle" font-size="20" fill="#f2f3ff">
    Spying on the Beaver: CF 2257C Example-IV Animated
  </text>
  <text x="380" y="60" text-anchor="middle" font-size="12" fill="#a9b0d6">n=6, parents [1,2,2,1,1], dams = {1, 3, 5}</text>

  <g stroke="#5a6290" stroke-width="3">
    <line x1="380" y1="100" x2="230" y2="180"/>
    <line x1="380" y1="100" x2="380" y2="180"/>
    <line x1="380" y1="100" x2="530" y2="180"/>
    <line x1="230" y1="180" x2="150" y2="270"/>
    <line x1="230" y1="180" x2="300" y2="270"/>
  </g>

  <!-- camera above vertex 3, edge 2-3 midpoint -->
  <circle class="cam3-glow" cx="190" cy="225" r="20" fill="#ffd166" opacity="0"/>
  <rect x="176" y="213" width="28" height="22" rx="4" fill="#ffd166" opacity="0.35"/>
  <circle cx="190" cy="224" r="5.5" fill="#3a2e0a" opacity="0.35"/>

  <!-- camera above vertex 5, edge 1-5 midpoint -->
  <circle class="cam5-glow" cx="380" cy="140" r="20" fill="#ffd166" opacity="0"/>
  <rect x="366" y="128" width="28" height="22" rx="4" fill="#ffd166" opacity="0.35"/>
  <circle cx="380" cy="139" r="5.5" fill="#3a2e0a" opacity="0.35"/>

  <!-- root pulse: shows a dam-1 arrival with no camera fired -->
  <circle class="root-pulse" cx="380" cy="100" r="34" fill="none" stroke="#9fe0a8" stroke-width="2" opacity="0"/>

  <g font-family="Georgia, serif" font-size="15" text-anchor="middle">
    <circle cx="380" cy="100" r="26" fill="#2c3560" stroke="#9fe0a8" stroke-width="3"/>
    <text x="380" y="106" fill="#eef1ff">1</text>

    <circle cx="230" cy="180" r="24" fill="#2c3560" stroke="#6c76a8" stroke-width="2"/>
    <text x="230" y="186" fill="#eef1ff">2</text>

    <circle cx="530" cy="180" r="24" fill="#2c3560" stroke="#6c76a8" stroke-width="2"/>
    <text x="530" y="186" fill="#eef1ff">6</text>

    <circle cx="150" cy="270" r="24" fill="#2c3560" stroke="#ffd166" stroke-width="3"/>
    <text x="150" y="276" fill="#eef1ff">3</text>

    <circle cx="300" cy="270" r="22" fill="#2c3560" stroke="#6c76a8" stroke-width="2"/>
    <text x="300" y="276" fill="#eef1ff">4</text>

    <circle cx="380" cy="180" r="24" fill="#2c3560" stroke="#ffd166" stroke-width="3"/>
    <text x="380" y="186" fill="#eef1ff">5</text>
  </g>

  <!-- the beaver token: starts at the root, animation moves it via translate -->
  <g class="beaver-token">
    <ellipse cx="380" cy="100" rx="12" ry="8" fill="#c98a4b"/>
    <circle cx="391" cy="93" r="6" fill="#c98a4b"/>
    <circle cx="394" cy="89" r="1.6" fill="#3a2313"/>
    <ellipse cx="368" cy="103" rx="6" ry="4" fill="#8a5a2e"/>
  </g>

  <text x="290" y="400" font-size="13" fill="#a9b0d6">
    <tspan x="290" dy="0">Loop (9s):</tspan>
    <tspan x="330" dy="18">root to dam 1 (no camera lights)</tspan>
    <tspan x="330" dy="18">to dam 3 (camera above 3 lights)</tspan>
    <tspan x="330" dy="18">to dam 5 (camera above 5 lights),</tspan>
    <tspan x="330" dy="18">repeat.</tspan>
  </text>

  <text x="180" y="510" font-size="12" fill="#7d84ab" font-style="italic">
    If your viewer doesn't animate SVGs, try to visualize the loop in your mind.
  </text>

</svg>
