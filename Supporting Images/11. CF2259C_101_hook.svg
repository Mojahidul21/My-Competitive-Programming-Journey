<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- master clock: everything else syncs to this via "clock.begin+Ns" -->
  <animate id="clock" attributeName="opacity" from="1" to="1" dur="9s" begin="0s" repeatCount="indefinite" />
  <rect x="0" y="0" width="900" height="340" rx="18" fill="#fbf6ea" stroke="#e3d9bd" stroke-width="2" />
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a3b22"> The Magic Rat and the Cheese Stick </text>
  <text x="450" y="54" text-anchor="middle" font-size="13" fill="#7a6a48"> a = [-1, -1, -1, -1, -1, -1] — maximize the 1...0...1 territory </text>
  <!-- index labels -->
  <g font-size="12" fill="#9c8c66" text-anchor="middle">
    <text x="115" y="250">i=0</text>
    <text x="245" y="250">i=1</text>
    <text x="375" y="250">i=2</text>
    <text x="505" y="250">i=3</text>
    <text x="635" y="250">i=4</text>
    <text x="765" y="250">i=5</text>
  </g>
  <!-- ===================== CELLS ===================== -->
  <!-- Cell template repeated for i = 0..5, x = 60 + 130*i -->
  <!-- Cell 0 : becomes a CHEESE anchor -->
  <g>
    <rect x="60" y="120" width="110" height="110" rx="14" fill="#c88a4a" stroke="#8a5a2a" stroke-width="3">
      <animate attributeName="fill" from="#c88a4a" to="#ffcf4d" begin="clock.begin+1.0s" dur="0.4s" fill="freeze" />
      <animate attributeName="stroke" from="#8a5a2a" to="#d99e1a" begin="clock.begin+1.0s" dur="0.4s" fill="freeze" />
    </rect>
    <circle cx="90" cy="150" r="7" fill="#a9762f" opacity="0.6">
      <animate attributeName="opacity" from="0.6" to="0" begin="clock.begin+1.0s" dur="0.4s" fill="freeze" />
    </circle>
    <circle cx="140" cy="180" r="9" fill="#a9762f" opacity="0.6">
      <animate attributeName="opacity" from="0.6" to="0" begin="clock.begin+1.0s" dur="0.4s" fill="freeze" />
    </circle>
    <circle cx="95" cy="150" r="6" fill="#e6b300" opacity="0">
      <animate attributeName="opacity" from="0" to="0.85" begin="clock.begin+1.0s" dur="0.4s" fill="freeze" />
    </circle>
    <circle cx="140" cy="185" r="8" fill="#e6b300" opacity="0">
      <animate attributeName="opacity" from="0" to="0.85" begin="clock.begin+1.0s" dur="0.4s" fill="freeze" />
    </circle>
    <text x="115" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff"> -1
      <animate attributeName="opacity" from="1" to="0" begin="clock.begin+1.0s" dur="0.3s" fill="freeze" />
    </text>
    <text x="115" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a4a00" opacity="0"> 1
      <animate attributeName="opacity" from="0" to="1" begin="clock.begin+1.15s" dur="0.3s" fill="freeze" />
    </text>
  </g>
  <!-- Cells 1-4 : become CRUMBS (0) -->
  <g id="crumbGroup">
    <!-- i=1 -->
    <rect x="190" y="120" width="110" height="110" rx="14" fill="#c88a4a" stroke="#8a5a2a" stroke-width="3">
      <animate attributeName="fill" from="#c88a4a" to="#e3d9bd" begin="clock.begin+4.0s" dur="0.4s" fill="freeze" />
      <animate attributeName="stroke" from="#8a5a2a" to="#b8a878" begin="clock.begin+4.0s" dur="0.4s" fill="freeze" />
    </rect>
    <text x="245" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff"> -1
      <animate attributeName="opacity" from="1" to="0" begin="clock.begin+4.0s" dur="0.3s" fill="freeze" />
    </text>
    <text x="245" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a6a48" opacity="0"> 0
      <animate attributeName="opacity" from="0" to="1" begin="clock.begin+4.15s" dur="0.3s" fill="freeze" />
    </text>
    <!-- i=2 -->
    <rect x="320" y="120" width="110" height="110" rx="14" fill="#c88a4a" stroke="#8a5a2a" stroke-width="3">
      <animate attributeName="fill" from="#c88a4a" to="#e3d9bd" begin="clock.begin+4.05s" dur="0.4s" fill="freeze" />
      <animate attributeName="stroke" from="#8a5a2a" to="#b8a878" begin="clock.begin+4.05s" dur="0.4s" fill="freeze" />
    </rect>
    <text x="375" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff"> -1
      <animate attributeName="opacity" from="1" to="0" begin="clock.begin+4.05s" dur="0.3s" fill="freeze" />
    </text>
    <text x="375" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a6a48" opacity="0"> 0
      <animate attributeName="opacity" from="0" to="1" begin="clock.begin+4.2s" dur="0.3s" fill="freeze" />
    </text>
    <!-- i=3 -->
    <rect x="450" y="120" width="110" height="110" rx="14" fill="#c88a4a" stroke="#8a5a2a" stroke-width="3">
      <animate attributeName="fill" from="#c88a4a" to="#e3d9bd" begin="clock.begin+4.1s" dur="0.4s" fill="freeze" />
      <animate attributeName="stroke" from="#8a5a2a" to="#b8a878" begin="clock.begin+4.1s" dur="0.4s" fill="freeze" />
    </rect>
    <text x="505" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff"> -1
      <animate attributeName="opacity" from="1" to="0" begin="clock.begin+4.1s" dur="0.3s" fill="freeze" />
    </text>
    <text x="505" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a6a48" opacity="0"> 0
      <animate attributeName="opacity" from="0" to="1" begin="clock.begin+4.25s" dur="0.3s" fill="freeze" />
    </text>
    <!-- i=4 -->
    <rect x="580" y="120" width="110" height="110" rx="14" fill="#c88a4a" stroke="#8a5a2a" stroke-width="3">
      <animate attributeName="fill" from="#c88a4a" to="#e3d9bd" begin="clock.begin+4.15s" dur="0.4s" fill="freeze" />
      <animate attributeName="stroke" from="#8a5a2a" to="#b8a878" begin="clock.begin+4.15s" dur="0.4s" fill="freeze" />
    </rect>
    <text x="635" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff"> -1
      <animate attributeName="opacity" from="1" to="0" begin="clock.begin+4.15s" dur="0.3s" fill="freeze" />
    </text>
    <text x="635" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a6a48" opacity="0"> 0
      <animate attributeName="opacity" from="0" to="1" begin="clock.begin+4.3s" dur="0.3s" fill="freeze" />
    </text>
  </g>
  <!-- Cell 5 : becomes a CHEESE anchor -->
  <g>
    <rect x="710" y="120" width="110" height="110" rx="14" fill="#c88a4a" stroke="#8a5a2a" stroke-width="3">
      <animate attributeName="fill" from="#c88a4a" to="#ffcf4d" begin="clock.begin+2.5s" dur="0.4s" fill="freeze" />
      <animate attributeName="stroke" from="#8a5a2a" to="#d99e1a" begin="clock.begin+2.5s" dur="0.4s" fill="freeze" />
    </rect>
    <circle cx="740" cy="150" r="7" fill="#a9762f" opacity="0.6">
      <animate attributeName="opacity" from="0.6" to="0" begin="clock.begin+2.5s" dur="0.4s" fill="freeze" />
    </circle>
    <circle cx="790" cy="180" r="9" fill="#a9762f" opacity="0.6">
      <animate attributeName="opacity" from="0.6" to="0" begin="clock.begin+2.5s" dur="0.4s" fill="freeze" />
    </circle>
    <circle cx="745" cy="150" r="6" fill="#e6b300" opacity="0">
      <animate attributeName="opacity" from="0" to="0.85" begin="clock.begin+2.5s" dur="0.4s" fill="freeze" />
    </circle>
    <circle cx="790" cy="185" r="8" fill="#e6b300" opacity="0">
      <animate attributeName="opacity" from="0" to="0.85" begin="clock.begin+2.5s" dur="0.4s" fill="freeze" />
    </circle>
    <text x="765" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff"> -1
      <animate attributeName="opacity" from="1" to="0" begin="clock.begin+2.5s" dur="0.3s" fill="freeze" />
    </text>
    <text x="765" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a4a00" opacity="0"> 1
      <animate attributeName="opacity" from="0" to="1" begin="clock.begin+2.65s" dur="0.3s" fill="freeze" />
    </text>
  </g>
  <!-- ================= ZAP glow pulses at the two anchors ================= -->
  <circle cx="115" cy="175" r="10" fill="#fff2b0" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.88;0.95;1" begin="clock.begin+0.8s" dur="0.3s" fill="freeze" />
    <animate attributeName="r" values="10;10;60;10" keyTimes="0;0.88;0.95;1" begin="clock.begin+0.8s" dur="0.3s" fill="freeze" />
  </circle>
  <circle cx="765" cy="175" r="10" fill="#fff2b0" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0" keyTimes="0;0.88;0.95;1" begin="clock.begin+2.3s" dur="0.3s" fill="freeze" />
    <animate attributeName="r" values="10;10;60;10" keyTimes="0;0.88;0.95;1" begin="clock.begin+2.3s" dur="0.3s" fill="freeze" />
  </circle>
  <!-- sweeping "keep it plain" field bar over the interior before the crumb-flip -->
  <rect x="190" y="115" width="0" height="120" rx="10" fill="#ffe9a8" opacity="0.35">
    <animate attributeName="width" from="0" to="500" begin="clock.begin+3.6s" dur="0.4s" fill="freeze" />
    <animate attributeName="opacity" values="0.35;0.35;0" keyTimes="0;0.7;1" begin="clock.begin+4.1s" dur="0.5s" fill="freeze" />
  </rect>
  <!-- ===================== THE RAT ===================== -->
  <g id="ratPos" transform="translate(-40,55)">
    <animateTransform attributeName="transform" type="translate" values="-40,55; -40,55; 115,55; 115,55; 765,55; 765,55; 440,35; 440,35; 440,25; 440,35" keyTimes="0;0.03;0.14;0.20;0.30;0.36;0.44;0.51;0.75;1" begin="clock.begin" dur="9s" fill="freeze" />
    <!-- tail -->
    <path d="M -18 10 Q -35 0 -30 -12" stroke="#8a8a8a" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- body -->
    <ellipse cx="0" cy="8" rx="22" ry="16" fill="#9c9c9c" />
    <!-- head -->
    <circle cx="20" cy="-2" r="13" fill="#a8a8a8" />
    <!-- ears -->
    <circle cx="14" cy="-14" r="6" fill="#f2b8c6" />
    <circle cx="26" cy="-14" r="6" fill="#f2b8c6" />
    <!-- eye -->
    <circle cx="25" cy="-4" r="2" fill="#222" />
    <!-- nose -->
    <circle cx="32" cy="0" r="2.5" fill="#e08a9a" />
    <!-- whiskers -->
    <line x1="30" y1="1" x2="42" y2="-2" stroke="#666" stroke-width="1" />
    <line x1="30" y1="3" x2="42" y2="4" stroke="#666" stroke-width="1" />
    <!-- legs -->
    <line x1="-8" y1="20" x2="-10" y2="30" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round" />
    <line x1="10" y1="22" x2="12" y2="32" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round" />
    <!-- magic stick -->
    <line x1="0" y1="0" x2="-28" y2="-24" stroke="#7a4a1e" stroke-width="4" stroke-linecap="round" />
    <path d="M -28 -24 l -4 -8 l 6 3 l 2 -8 l 2 8 l 6 -3 l -4 8 l 6 3 l -8 2 l 3 6 l -6 -3 z" fill="#ffd54d" stroke="#d99e1a" stroke-width="1">
      <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1;1.4;1" keyTimes="0;0.85;0.92;1" begin="clock.begin+0.8s" dur="0.3s" fill="freeze" />
    </path>
  </g>
  <!-- ===================== TERRITORY BRACKET ===================== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="clock.begin+4.6s" dur="0.5s" fill="freeze" />
    <path d="M 60 255 Q 450 300 820 255" stroke="#d99e1a" stroke-width="3" fill="none" stroke-dasharray="6 4" />
    <text x="450" y="300" text-anchor="middle" font-size="18" font-weight="bold" fill="#a06a10"> rat's territory — score = 6 </text>
  </g>
</svg>