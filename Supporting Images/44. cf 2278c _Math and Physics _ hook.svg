<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#1b0f3a"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7b0"/><stop offset="0.5" stop-color="#ffb347"/><stop offset="1" stop-color="#e8431f"/>
    </radialGradient>
    <radialGradient id="coreSm" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9fff4"/><stop offset="0.6" stop-color="#4fe0c0"/><stop offset="1" stop-color="#127f8c"/>
    </radialGradient>
  </defs>
  <rect width="760" height="300" rx="18" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="25" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="35" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="60" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="265" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="255" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- title -->
  <text x="380" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#ffe9a8" letter-spacing="2">Math and Physics</text>
  <text x="380" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#9fb3ff">split a core · feed its neighbours · the edges leak</text>
  <!-- chain -->
  <g stroke="#6b7bd6" stroke-width="2" stroke-dasharray="4 5" opacity="0.7">
    <line x1="120" y1="165" x2="270" y2="165"/><line x1="270" y1="165" x2="420" y2="165"/><line x1="420" y1="165" x2="570" y2="165"/><line x1="570" y1="165" x2="650" y2="165"/>
  </g>
  <!-- small cores -->
  <g font-family="Georgia, serif" text-anchor="middle" font-weight="bold">
    <circle cx="270" cy="165" r="26" fill="url(#coreSm)"><animate attributeName="r" values="24;29;24" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="270" y="171" font-size="20" fill="#06323a">1</text>
    <circle cx="420" cy="165" r="26" fill="url(#coreSm)"><animate attributeName="r" values="29;24;29" dur="2.8s" repeatCount="indefinite"/></circle>
    <text x="420" y="171" font-size="20" fill="#06323a">1</text>
    <circle cx="570" cy="165" r="26" fill="url(#coreSm)"><animate attributeName="r" values="24;28;24" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="570" y="171" font-size="20" fill="#06323a">1</text>
    <!-- big end cores -->
    <circle cx="120" cy="165" r="46" fill="url(#core)"><animate attributeName="r" values="42;50;42" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="120" y="176" font-size="34" fill="#4a1500">a</text>
    <circle cx="660" cy="165" r="46" fill="url(#core)"><animate attributeName="r" values="50;42;50" dur="2.0s" repeatCount="indefinite"/></circle>
    <text x="660" y="176" font-size="34" fill="#4a1500">b</text>
  </g>
  <!-- energy packets travelling right and left -->
  <circle r="6" fill="#fff7b0"><animate attributeName="cx" values="150;250;150" dur="3s" repeatCount="indefinite"/><animate attributeName="cy" values="165;165;165" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#ffb347"><animate attributeName="cx" values="630;440;630" dur="3.4s" repeatCount="indefinite"/><animate attributeName="cy" values="165;165;165" dur="3.4s" repeatCount="indefinite"/></circle>
  <!-- leaking mass at edges -->
  <g font-family="Georgia, serif" font-weight="bold" fill="#ff7a7a">
    <text x="40" y="120" font-size="22">−1<animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;-18 -14;0 0" dur="1.6s" repeatCount="indefinite"/></text>
    <text x="715" y="120" font-size="22">−1<animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;14 -14;0 0" dur="1.6s" repeatCount="indefinite"/></text>
  </g>
  <!-- floating statement symbols -->
  <g font-family="Georgia, serif" fill="#c5d0ff">
    <text x="190" y="115" font-size="16">x + y = a<animate attributeName="font-size" values="12;20;12" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></text>
    <text x="390" y="110" font-size="16">a ≥ 2<animate attributeName="font-size" values="20;12;20" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></text>
    <text x="520" y="225" font-size="16">k → 1<animate attributeName="font-size" values="12;19;12" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></text>
    <text x="230" y="230" font-size="16">max ?<animate attributeName="font-size" values="19;12;19" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></text>
  </g>
  <!-- signature -->
  <text x="742" y="288" text-anchor="end" font-family="'Segoe Script','Bradley Hand','Brush Script MT','Lucida Handwriting',cursive" font-size="17" fill="#ffe9a8">Ace_Azimuth_Aviator</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
