<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="ui-monospace, 'SF Mono', 'Fira Code', Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
