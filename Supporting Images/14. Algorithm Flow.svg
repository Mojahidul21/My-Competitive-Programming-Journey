<svg viewBox="0 0 620 920" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555555" />
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="920" fill="#ffffff" />
  <text x="310" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Algorithm flow</text>
  <!-- 1. Take input -->
  <rect x="190" y="50" width="240" height="50" rx="8" fill="#dbe9ff" stroke="#9db8e8" />
  <text x="310" y="80" text-anchor="middle" font-size="14" fill="#1a1a1a">Take input: n, k</text>
  <line x1="310" y1="100" x2="310" y2="130" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 2. Decision diamond -->
  <polygon points="310,130 430,190 310,250 190,190" fill="#fff4d6" stroke="#e0c26a" />
  <text x="310" y="184" text-anchor="middle" font-size="13" fill="#1a1a1a">n ≤ k ≤ 2n−1 ?</text>
  <text x="310" y="200" text-anchor="middle" font-size="11" fill="#555555">(valid range check)</text>
  <!-- No branch -->
  <polyline points="430,190 520,190 520,215.5" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="475" y="180" text-anchor="middle" font-size="12" fill="#555555">No</text>
  <rect x="470" y="215" width="100" height="45" rx="8" fill="#ffe0e0" stroke="#e29b9b" />
  <text x="520" y="243" text-anchor="middle" font-size="13" fill="#1a1a1a">Print −1</text>
  <line x1="520" y1="260" x2="520" y2="825" stroke="#555555" stroke-width="1.5" stroke-dasharray="4,3" />
  <line x1="520" y1="825" x2="368" y2="825" stroke="#555555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <!-- Yes branch -->
  <line x1="310" y1="250" x2="310" y2="280" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="325" y="270" font-size="12" fill="#555555">Yes</text>
  <!-- 3. Boundaries + allocate -->
  <rect x="140" y="280" width="340" height="60" rx="8" fill="#e8e8e8" stroke="#bbbbbb" />
  <text x="310" y="305" text-anchor="middle" font-size="13" fill="#1a1a1a">Compute diaStart, diaEnd, verStart, verEnd,</text>
  <text x="310" y="323" text-anchor="middle" font-size="13" fill="#1a1a1a">horStart, horEnd &amp; allocate n×n matrix</text>
  <line x1="310" y1="340" x2="310" y2="370" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 4. Diagonal update -->
  <rect x="160" y="370" width="300" height="50" rx="8" fill="#dbe9ff" stroke="#9db8e8" />
  <text x="310" y="400" text-anchor="middle" font-size="13" fill="#1a1a1a">Diagonal update: diaStart .. diaEnd</text>
  <line x1="310" y1="420" x2="310" y2="450" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 5. Vertical update -->
  <rect x="160" y="450" width="300" height="50" rx="8" fill="#d9f2d9" stroke="#8fc98f" />
  <text x="310" y="480" text-anchor="middle" font-size="13" fill="#1a1a1a">Vertical update: verStart .. verEnd</text>
  <line x1="310" y1="500" x2="310" y2="530" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 6. Horizontal update -->
  <rect x="160" y="530" width="300" height="50" rx="8" fill="#ffe3c2" stroke="#e0a95f" />
  <text x="310" y="560" text-anchor="middle" font-size="13" fill="#1a1a1a">Horizontal update: horStart .. horEnd</text>
  <line x1="310" y1="580" x2="310" y2="610" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 7. Remaining update -->
  <rect x="160" y="610" width="300" height="50" rx="8" fill="#f0f0f0" stroke="#bbbbbb" />
  <text x="310" y="640" text-anchor="middle" font-size="13" fill="#1a1a1a">Remaining update: fill leftover cells</text>
  <line x1="310" y1="660" x2="310" y2="690" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 8. Print matrix -->
  <rect x="190" y="690" width="240" height="50" rx="8" fill="#dbe9ff" stroke="#9db8e8" />
  <text x="310" y="720" text-anchor="middle" font-size="14" fill="#1a1a1a">Print the matrix</text>
  <line x1="310" y1="740" x2="310" y2="800" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 9. End -->
  <rect x="255" y="800" width="110" height="50" rx="25" fill="#e8e8e8" stroke="#bbbbbb" />
  <text x="310" y="830" text-anchor="middle" font-size="14" fill="#1a1a1a">End</text>
  <!-- legend -->
  <text x="310" y="905" text-anchor="middle" font-size="11" fill="#888888">[Dashed line: the early-exit path when the range check fails]</text>
</svg>