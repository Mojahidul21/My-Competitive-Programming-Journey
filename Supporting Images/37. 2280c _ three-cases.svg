<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Where the segment lands relative to the peak gap" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Where the segment lands relative to the peak gap</title>
  <defs>
