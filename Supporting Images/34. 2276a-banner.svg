<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" font-family="Segoe UI,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e7" />
      <stop offset="1" stop-color="#f1d9a4" />
    </linearGradient>
    <linearGradient id="ch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680" />
      <stop offset="1" stop-color="#f2b705" />
    </linearGradient>
    <linearGradient id="sx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc766" />
      <stop offset="1" stop-color="#e8590c" />
    </linearGradient>
    <radialGradient id="sa" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ff9a8f" />
      <stop offset=".6" stop-color="#d9412f" />
      <stop offset="1" stop-color="#8e2a1c" />
    </radialGradient>
    <linearGradient id="br" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9a8" />
      <stop offset="1" stop-color="#d9a863" />
    </linearGradient>
    <radialGradient id="pl" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#fff" />
      <stop offset="1" stop-color="#cdd9e6" />
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".3" />
    </filter>
  </defs>
  <rect width="1000" height="260" rx="20" fill="url(#bg)" stroke="#d9c98a" stroke-width="2" />
  <circle cx="560" cy="40" r="120" fill="#ffffff" opacity=".35" />
  <circle cx="980" cy="250" r="140" fill="#e8c26a" opacity=".25" />
  <!-- text -->
  <rect x="40" y="34" width="372" height="26" rx="13" fill="#4a3412" />
  <text x="226" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" letter-spacing="1">CODEFORCES · EDUCATIONAL ROUND 195 · A</text>
  <text x="40" y="122" font-size="50" font-weight="800" fill="#3b2a0e">Perfect Sandwiches</text>
  <text x="42" y="156" font-size="19" fill="#6b5a3a">Two budgets, one answer: sausage and surplus cheese.</text>
  <g font-size="13" font-weight="700" fill="#4a3412">
    <rect x="40" y="184" width="66" height="26" rx="13" fill="#fffdf5" stroke="#b9a56a" />
    <text x="73" y="202" text-anchor="middle">greedy</text>
    <rect x="114" y="184" width="56" height="26" rx="13" fill="#fffdf5" stroke="#b9a56a" />
    <text x="142" y="202" text-anchor="middle">math</text>
    <rect x="178" y="184" width="60" height="26" rx="13" fill="#fffdf5" stroke="#b9a56a" />
    <text x="208" y="202" text-anchor="middle">★ 800</text>
  </g>
  <rect x="252" y="182" width="210" height="30" rx="15" fill="#2e9e5b" />
  <text x="357" y="203" text-anchor="middle" font-size="16" font-weight="700" fill="#fff" font-family="Consolas,Menlo,monospace">min(a − b, b) or -1</text>
  <!-- floating decorations -->
  <g filter="url(#sh)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.4s" repeatCount="indefinite" />
      <g transform="translate(585,60) rotate(-14)">
        <rect width="38" height="38" rx="6" fill="url(#ch)" stroke="#b7950b" stroke-width="2" />
        <circle cx="11" cy="12" r="4" fill="#c98f00" opacity=".45" />
        <circle cx="26" cy="26" r="3" fill="#c98f00" opacity=".45" />
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="2.8s" repeatCount="indefinite" />
      <circle cx="640" cy="168" r="19" fill="url(#sa)" stroke="#6e1f14" stroke-width="2" />
      <ellipse cx="633" cy="160" rx="7" ry="3.5" fill="#fff" opacity=".4" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.9s" repeatCount="indefinite" />
      <g transform="translate(945,150) rotate(16)">
        <rect width="34" height="34" rx="6" fill="url(#sx)" stroke="#b34a08" stroke-width="2" />
        <circle cx="10" cy="11" r="3.5" fill="#c98f00" opacity=".45" />
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="3.1s" repeatCount="indefinite" />
      <circle cx="950" cy="70" r="17" fill="url(#sa)" stroke="#6e1f14" stroke-width="2" />
      <ellipse cx="944" cy="63" rx="6" ry="3" fill="#fff" opacity=".4" />
    </g>
  </g>
  <!-- sandwich -->
  <ellipse cx="780" cy="226" rx="150" ry="22" fill="url(#pl)" stroke="#9fb3c8" stroke-width="2" filter="url(#sh)" />
  <g filter="url(#sh)">
    <!-- bottom bread slice (flat, sandwich-style) -->
    <rect x="700" y="178" width="160" height="28" rx="6" fill="url(#br)" stroke="#a8793f" stroke-width="2" />
    <!-- sausage filling -->
    <rect x="708" y="158" width="144" height="22" rx="4" fill="url(#sx)" stroke="#b34a08" stroke-width="2" />
    <!-- cheese slice (slightly larger, peeking out) -->
    <rect x="704" y="140" width="152" height="20" rx="3" fill="url(#ch)" stroke="#b7950b" stroke-width="2" />
    <!-- top bread slice (flat) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="2.6s" repeatCount="indefinite" />
      <rect x="700" y="116" width="160" height="28" rx="6" fill="url(#br)" stroke="#a8793f" stroke-width="2" />
      <!-- subtle seeds / texture on top bread -->
      <circle cx="730" cy="128" r="2.5" fill="#fff6dc" />
      <circle cx="760" cy="122" r="2.5" fill="#fff6dc" />
      <circle cx="790" cy="130" r="2.5" fill="#fff6dc" />
      <circle cx="820" cy="124" r="2.5" fill="#fff6dc" />
    </g>
    <!-- optional sausage bits on the side for interest -->
    <ellipse cx="695" cy="155" rx="12" ry="8" fill="url(#sa)" stroke="#6e1f14" stroke-width="1.5" transform="rotate(-25 695 155)" />
    <ellipse cx="865" cy="148" rx="11" ry="7" fill="url(#sa)" stroke="#6e1f14" stroke-width="1.5" transform="rotate(20 865 148)" />
  </g>
  <text x="990" y="258" text-anchor="end" font-size="11" fill="black">Ace_Azimuth_Aviator</text>
</svg>