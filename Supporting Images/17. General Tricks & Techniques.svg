<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="140" viewBox="0 0 1400 140">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="55%" stop-color="#29b6f6" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="100%" stop-color="#ffb300" />
    </linearGradient>
    <linearGradient id="melonGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66bb6a" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <radialGradient id="melonRed" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef5350" />
      <stop offset="100%" stop-color="#b71c1c" />
    </radialGradient>
    <linearGradient id="bottleBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81d4fa" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>
    <linearGradient id="pasteWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eeeeee" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.8" flood-opacity="0.35" />
    </filter>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Hot sunny sky -->
  <rect width="1400" height="140" fill="url(#sky)" />
  <!-- Strong hot sun positioned over the watermelon-cap man -->
  <g transform="translate(340, 22)">
    <!-- Outer intense glow pulse -->
    <circle r="32" fill="#ffeb3b" opacity="0.35" filter="url(#sunGlow)">
      <animate attributeName="r" values="28;38;28" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.55;0.25" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Main sun body -->
    <circle r="22" fill="#ffeb3b" filter="url(#sunGlow)">
      <animate attributeName="r" values="20;26;20" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="15" fill="#ffc107">
      <animate attributeName="r" values="13;18;13" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Strong pulsing rays -->
    <g stroke="#ffeb3b" stroke-width="3" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-30" x2="0" y2="-44">
        <animate attributeName="y2" values="-40;-52;-40" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.5s" repeatCount="indefinite" />
      </line>
      <line x1="21" y1="-21" x2="32" y2="-32">
        <animate attributeName="x2" values="28;40;28" dur="1.7s" repeatCount="indefinite" />
        <animate attributeName="y2" values="-28;-40;-28" dur="1.7s" repeatCount="indefinite" />
      </line>
      <line x1="30" y1="0" x2="44" y2="0">
        <animate attributeName="x2" values="40;52;40" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.4s" repeatCount="indefinite" />
      </line>
      <line x1="21" y1="21" x2="32" y2="32">
        <animate attributeName="x2" values="28;40;28" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="y2" values="28;40;28" dur="1.8s" repeatCount="indefinite" />
      </line>
      <line x1="0" y1="30" x2="0" y2="44">
        <animate attributeName="y2" values="40;52;40" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.6s" repeatCount="indefinite" />
      </line>
      <line x1="-21" y1="21" x2="-32" y2="32">
        <animate attributeName="x2" values="-28;-40;-28" dur="1.7s" repeatCount="indefinite" />
        <animate attributeName="y2" values="28;40;28" dur="1.7s" repeatCount="indefinite" />
      </line>
      <line x1="-30" y1="0" x2="-44" y2="0">
        <animate attributeName="x2" values="-40;-52;-40" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="1.5s" repeatCount="indefinite" />
      </line>
      <line x1="-21" y1="-21" x2="-32" y2="-32">
        <animate attributeName="x2" values="-28;-40;-28" dur="1.9s" repeatCount="indefinite" />
        <animate attributeName="y2" values="-28;-40;-28" dur="1.9s" repeatCount="indefinite" />
      </line>
    </g>
  </g>
  <!-- Subtle heat haze -->
  <g opacity="0.25" stroke="#fffde7" stroke-width="1.5" fill="none">
    <path d="M40,95 Q70,85 100,95 Q130,105 160,95">
      <animate attributeName="d" values="M40,95 Q70,85 100,95 Q130,105 160,95;M40,93 Q70,83 100,97 Q130,103 160,93;M40,95 Q70,85 100,95 Q130,105 160,95" dur="3.8s" repeatCount="indefinite" />
    </path>
  </g>
  <!-- Sandy ground -->
  <rect x="0" y="112" width="1400" height="28" fill="url(#sand)" />
  <g fill="#f9a825" opacity="0.35">
    <circle cx="60" cy="120" r="1.4" />
    <circle cx="150" cy="126" r="1.1" />
    <circle cx="250" cy="118" r="1.6" />
    <circle cx="380" cy="128" r="1.2" />
    <circle cx="520" cy="122" r="1.5" />
    <circle cx="680" cy="125" r="1" />
    <circle cx="820" cy="119" r="1.3" />
    <circle cx="960" cy="127" r="1.4" />
    <circle cx="1120" cy="121" r="1.2" />
    <circle cx="1280" cy="124" r="1.5" />
  </g>
  <!-- ===== TITLE ===== -->
  <g filter="url(#shadow)">
    <text x="20" y="30" font-family="Impact, Arial Black, sans-serif" font-size="22" font-weight="300" fill="RED" letter-spacing="0.5">General Tricks &amp; Techniques</text>
  </g>
  <!-- ===== 1. WATERMELON SKIN AS CAP ===== -->
  <g transform="translate(270, 25)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="50" cy="78" rx="32" ry="20" fill="#5d4037" />
    <rect x="42" y="55" width="16" height="14" rx="3" fill="#ffcc80" />
    <!-- Head -->
    <circle cx="50" cy="42" r="24" fill="#ffcc80" />
    <!-- Face -->
    <circle cx="42" cy="38" r="2.8" fill="#4e342e" />
    <circle cx="58" cy="38" r="2.8" fill="#4e342e" />
    <path d="M42,50 Q50,58 58,50" fill="none" stroke="#4e342e" stroke-width="2.2" stroke-linecap="round" />
    <!-- Watermelon cap (animated slight bob) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="3.5s" repeatCount="indefinite" transform-origin="50 18" />
      <!-- Green rind -->
      <path d="M22,32 Q50,-8 78,32 L76,36 Q50,2 24,36 Z" fill="url(#melonGreen)" stroke="#1b5e20" stroke-width="1.8" />
      <!-- White pith -->
      <path d="M27,32 Q50,-2 73,32 L72,34 Q50,4 28,34 Z" fill="#f1f8e9" />
      <!-- Red flesh -->
      <path d="M32,32 Q50,5 68,32 L67,33 Q50,9 33,33 Z" fill="url(#melonRed)" />
      <!-- Seeds -->
      <ellipse cx="42" cy="24" rx="2" ry="2.8" fill="#212121" transform="rotate(-20 42 24)" />
      <ellipse cx="52" cy="21" rx="2" ry="2.8" fill="#212121" />
      <ellipse cx="60" cy="26" rx="1.8" ry="2.5" fill="#212121" transform="rotate(15 60 26)" />
    </g>
    <text x="50" y="111" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1b5e20" text-anchor="middle">Watermelon Cap</text>
  </g>
  <!-- ===== 2. PLASTIC BOTTLE TOY CAR ===== -->
  <g transform="translate(520, 48)" filter="url(#shadow)">
    <g>
      <!-- Car moves forward then reverses -->
      <animateTransform attributeName="transform" type="translate" values="0,0; 14,0; 0,0" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite" />
      <!-- Bottle body -->
      <rect x="8" y="18" width="78" height="30" rx="10" fill="url(#bottleBlue)" stroke="#01579b" stroke-width="1.8" opacity="0.92" />
      <!-- Ridges for plastic bottle look -->
      <g stroke="#4fc3f7" stroke-width="1.2" opacity="0.6">
        <line x1="20" y1="22" x2="20" y2="44" />
        <line x1="35" y1="22" x2="35" y2="44" />
        <line x1="50" y1="22" x2="50" y2="44" />
        <line x1="65" y1="22" x2="65" y2="44" />
      </g>
      <!-- Neck -->
      <rect x="82" y="24" width="16" height="18" rx="3" fill="#29b6f6" stroke="#01579b" stroke-width="1.2" />
      <!-- Bottle cap as nose -->
      <rect x="95" y="26" width="9" height="14" rx="2" fill="#ff5722" />
      <!-- Simple windows -->
      <rect x="18" y="23" width="20" height="11" rx="2" fill="#e1f5fe" opacity="0.75" />
      <rect x="48" y="23" width="20" height="11" rx="2" fill="#e1f5fe" opacity="0.75" />
      <!-- Wheels -->
      <circle cx="28" cy="52" r="12" fill="#37474f" stroke="#263238" stroke-width="2.2" />
      <circle cx="28" cy="52" r="5.5" fill="#90a4ae" />
      <circle cx="78" cy="52" r="12" fill="#37474f" stroke="#263238" stroke-width="2.2" />
      <circle cx="78" cy="52" r="5.5" fill="#90a4ae" />
      <!-- Spinning spokes: forward then reverse in sync with car movement -->
      <g stroke="#546e7a" stroke-width="1.6">
        <line x1="28" y1="43" x2="28" y2="61">
          <animateTransform attributeName="transform" type="rotate" values="0 28 52; 360 28 52; 0 28 52" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite" />
        </line>
        <line x1="78" y1="43" x2="78" y2="61">
          <animateTransform attributeName="transform" type="rotate" values="0 78 52; 360 78 52; 0 78 52" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite" />
        </line>
      </g>
      <!-- Axle -->
      <line x1="28" y1="52" x2="78" y2="52" stroke="#455a64" stroke-width="2.5" />
    </g>
    <text x="55" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#01579b" text-anchor="middle">Bottle Toy Car</text>
  </g>
  <!-- ===== 3. TOOTHPASTE PACKET → TOOTHBRUSH HOLDER ===== -->
  <g transform="translate(780, 30)" filter="url(#shadow)">
    <!-- Packet standing -->
    <rect x="15" y="28" width="50" height="58" rx="5" fill="url(#pasteWhite)" stroke="#9e9e9e" stroke-width="1.6" />
    <!-- Red header band -->
    <rect x="15" y="28" width="50" height="14" fill="#e53935" />
    <!-- Blue stripe -->
    <rect x="15" y="58" width="50" height="9" fill="#1565c0" />
    <!-- Top opening -->
    <ellipse cx="40" cy="28" rx="20" ry="5" fill="#fafafa" stroke="#bdbdbd" stroke-width="1" />
    <!-- Toothbrush - angular left-right swing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10; 10; -10" dur="2.2s" repeatCount="indefinite" transform-origin="40 30" />
      <rect x="35" y="2" width="10" height="32" rx="2.5" fill="#00897b" />
      <rect x="30" y="-5" width="20" height="14" rx="4" fill="#4db6ac" />
      <!-- Bristles -->
      <g stroke="#e0f2f1" stroke-width="1.4" stroke-linecap="round">
        <line x1="33" y1="-2" x2="33" y2="6" />
        <line x1="37" y1="-3" x2="37" y2="7" />
        <line x1="41" y1="-3" x2="41" y2="7" />
        <line x1="45" y1="-2" x2="45" y2="6" />
      </g>
    </g>
    <text x="40" y="102" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#c62828" text-anchor="middle">Toothbrush Holder by Toothpaste Packet</text>
  </g>
</svg>