<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="Animation of two values moving through an optional chain: one with a value, one with nullopt">
<title>Animation of two values moving through an optional chain: one with a value, one with nullopt</title>
<defs><style>@keyframes run{0%,4%{opacity:0;transform:translateX(0)}8%,10%{opacity:1;transform:translateX(0)}25%,30%{opacity:1;transform:translateX(165px)}45%,50%{transform:translateX(395px)}65%,70%{transform:translateX(625px)}85%,93%{opacity:1;transform:translateX(795px)}98%,100%{opacity:0;transform:translateX(795px)}}@keyframes la{0%,24.9%{opacity:1}25%,100%{opacity:0}}@keyframes lb{0%,24.9%{opacity:0}25%,44.9%{opacity:1}45%,100%{opacity:0}}@keyframes lc{0%,44.9%{opacity:0}45%,64.9%{opacity:1}65%,100%{opacity:0}}@keyframes ld{0%,64.9%{opacity:0}65%,100%{opacity:1}}.pk{opacity:0;animation:run 12s linear infinite}.la{animation:la 12s linear infinite}.lb{animation:lb 12s linear infinite}.lc{animation:lc 12s linear infinite}.ld{animation:ld 12s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style></defs>
<rect x="1" y="1" width="958" height="318" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="480" y="38" fill="#C5CCD6" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" >An optional chain: nothing in, nothing out (C++23)</text><rect x="170" y="127" width="170" height="40" rx="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><text x="255" y="153" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" text-anchor="middle" >findFirstOne(bits)</text><rect x="170" y="237" width="170" height="40" rx="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><text x="255" y="263" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" text-anchor="middle" >findFirstOne(bits)</text><rect x="400" y="127" width="170" height="40" rx="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><text x="485" y="153" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" text-anchor="middle" >.transform(+1)</text><rect x="400" y="237" width="170" height="40" rx="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><text x="485" y="263" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" text-anchor="middle" >.transform(+1)</text><rect x="630" y="127" width="170" height="40" rx="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><text x="715" y="153" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" text-anchor="middle" >.value_or(-1)</text><rect x="630" y="237" width="170" height="40" rx="8" fill="none" stroke="#FFC83D" stroke-width="2.5"/><text x="715" y="263" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="400" text-anchor="middle" >.value_or(-1)</text><text x="485" y="298" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="400" text-anchor="middle" font-style="italic" opacity=".8">skipped: empty in, empty out</text><text x="20" y="112" fill="#9DB83F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="400" text-anchor="start" >bits = &quot;0100&quot;</text><text x="20" y="222" fill="#FF8A1F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="400" text-anchor="start" >bits = &quot;000&quot;</text><g class="pk"><g transform="translate(90,147)"><rect x="-44" y="-18" width="88" height="36" rx="18" fill="#9DB83F" fill-opacity=".2" stroke="#9DB83F" stroke-width="3" /><text x="0" y="5" fill="#9DB83F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle" class="la">&quot;0100&quot;</text><text x="0" y="5" fill="#9DB83F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle" class="lb">1</text><text x="0" y="5" fill="#9DB83F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle" class="lc">2</text><text x="0" y="5" fill="#9DB83F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle" class="ld">2</text></g></g><g class="pk"><g transform="translate(90,257)"><rect x="-44" y="-18" width="88" height="36" rx="18" fill="#FF8A1F" fill-opacity=".2" stroke="#FF8A1F" stroke-width="3" stroke-dasharray="6 4"/><text x="0" y="5" fill="#FF8A1F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle