<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Table of three ternary attempts in C++23 showing branch types and whether each compiles">
<title>Table of three ternary attempts in C++23 showing branch types and whether each compiles</title>
<defs><style>@keyframes sweep{0%,30%{transform:translateY(0)}33.3%,63%{transform:translateY(62px)}66.6%,97%{transform:translateY(124px)}100%{transform:translateY(0)}}.sw{animation:sweep 9s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style></defs>
<rect x="1" y="1" width="898" height="348" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="450" y="40" fill="#C5CCD6" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" >Which nothing fits the false branch?</text><text x="560" y="92" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" text-anchor="middle" >true branch</text><text x="695" y="92" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" text-anchor="middle" >false branch</text><text x="812" y="92" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" text-anchor="middle" >result</text><rect class="sw" x="14" y="116" width="872" height="56" rx="10" fill="none" stroke="#FFC83D" stroke-width="2.5"/><text x="28" y="149" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="400" text-anchor="start" >cond ? v.emplace_back(i) : void()</text><text x="560" y="149" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" text-anchor="middle" >int&amp;</text><text x="695" y="149" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" text-anchor="middle" >void</text><text x="812" y="149" fill="#FF8A1F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle" >error</text><text x="28" y="211" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="400" text-anchor="start" >cond ? v.emplace_back(i) : 0</text><text x="560" y="211" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" text-anchor="middle" >int&amp;</text><text x="695" y="211" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" text-anchor="middle" >int</text><text x="812" y="211" fill="#9DB83F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle" >compiles (int)</text><text x="28" y="273" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="400" text-anchor="start" >cond ? static_cast&lt;void&gt;(v.emplace_back(i)) : void()</text><text x="560" y="273" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" text-anchor="middle" >void</text><text x="695" y="273" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="400" text-anchor="middle" >void</text><text x="812" y="273" fill="#9DB83F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" text-anchor="middle" >compiles (void)</text><text x="450" y="330" fill="#C5CCD6" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" opacity=".75">In C++23, emplace_back returns T&amp;. A void branch only pairs with another void branch (or a throw).</text>
</svg>
