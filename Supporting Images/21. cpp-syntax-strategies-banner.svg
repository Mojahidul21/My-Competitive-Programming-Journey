<svg width="1400" height="140" viewBox="0 0 1400 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="55%" stop-color="#111a33" />
      <stop offset="100%" stop-color="#0b1020" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#a5d6ff" />
      <stop offset="100%" stop-color="#8b6bff" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b6bff" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b6bff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b6bff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1400" height="140" fill="url(#bg)" />
  <!-- faint grid -->
  <g stroke="#1c2740" stroke-width="1">
    <path d="M0 35 H1400 M0 70 H1400 M0 105 H1400" />
    <path d="M100 0 V140 M300 0 V140 M500 0 V140 M700 0 V140 M900 0 V140 M1100 0 V140 M1300 0 V140" />
  </g>
  <!-- twinkling stars -->
  <g fill="#c3b6ff">
    <circle cx="60" cy="24" r="1.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="112" r="1.2">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="1330" cy="30" r="1.6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1250" cy="100" r="1.2">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1180" cy="45" r="1.3">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite" />
    </circle>
  </g>
  <!-- soft glow behind title -->
  <ellipse cx="240" cy="70" rx="230" ry="90" fill="url(#glow)" />
  <!-- title -->
  <text x="70" y="40" font-family="Segoe UI, Verdana, sans-serif" font-size="34" font-weight="700" fill="url(#textGrad)"> C++ Syntax Strategies </text>
  <text x="72" y="68" font-family="Segoe UI, Verdana, sans-serif" font-size="15" fill="#8b98b3"> Language features and idioms that make contest code shorter, safer, faster </text>
  <!-- typing code line -->
  <g transform="translate(70,85)" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9fc8ff">
    <text>
      <tspan fill="#ff9d5c">auto</tspan>
      <tspan fill="#e6edf7"> cnt = </tspan>
      <tspan fill="#79c0ff">count_if</tspan>
      <tspan fill="#e6edf7">(v.begin(), v.end(), [](</tspan>
      <tspan fill="#ff9d5c">int</tspan>
      <tspan fill="#e6edf7"> x){ </tspan>
      <tspan fill="#c3b6ff">return</tspan>
      <tspan fill="#e6edf7"> x &gt; 0; });</tspan>
      <animate attributeName="opacity" values="0.3;1;1;0.3" dur="4s" repeatCount="indefinite" />
    </text>
    <rect x="0" y="-14" width="3" height="16" fill="#e6edf7">
      <animate attributeName="x" values="0;520;520;0" keyTimes="0;0.5;0.9;1" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
  <!-- spinning template angle brackets, standing in for generic/template syntax -->
  <g transform="translate(1120,68)">
    <circle r="46" fill="none" stroke="#2a3a5c" stroke-width="1.5" stroke-dasharray="3 4" />
    <g font-family="Consolas, Menlo, monospace" font-size="26" font-weight="700" fill="#79c0ff" text-anchor="middle">
      <text y="9">&lt;T&gt;</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      <circle cx="46" cy="0" r="4" fill="#ff9d5c" />
    </g>
  </g>
  <!-- tag chips -->
  <g font-family="Segoe UI, Verdana, sans-serif" font-size="12" fill="#8b98b3">
    <g transform="translate(425,100)">
      <rect width="125" height="24" rx="12" fill="#152037" stroke="#2a3a5c" />
      <text x="62" y="16" text-anchor="middle">Ace_Azimuth_Aviator</text>
    </g>
    <g transform="translate(560,100)">
      <rect width="74" height="24" rx="12" fill="#152037" stroke="#2a3a5c" />
      <text x="37" y="16" text-anchor="middle">Lambdas</text>
    </g>
    <g transform="translate(644,100)">
      <rect width="82" height="24" rx="12" fill="#152037" stroke="#2a3a5c" />
      <text x="41" y="16" text-anchor="middle">STL Idioms</text>
    </g>
    <g transform="translate(736,100)">
      <rect width="90" height="24" rx="12" fill="#152037" stroke="#2a3a5c" />
      <text x="45" y="16" text-anchor="middle">Templates</text>
    </g>
    <g transform="translate(836,100)">
      <rect width="96" height="24" rx="12" fill="#152037" stroke="#2a3a5c" />
      <text x="48" y="16" text-anchor="middle">Shorthand Tricks</text>
    </g>
  </g>
</svg>