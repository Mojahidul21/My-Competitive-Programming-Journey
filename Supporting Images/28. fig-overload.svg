<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Animated overload resolution for describe(0), describe(NULL) and describe(nullptr)">
<title>Animated overload resolution for describe(0), describe(NULL) and describe(nullptr)</title>
<defs><style>@keyframes sc{0%{opacity:0}3%,30%{opacity:1}33.3%,100%{opacity:0}}.s{opacity:0;animation:sc 9s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none !important}}</style></defs>
<rect x="1" y="1" width="898" height="328" rx="16" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="450" y="36" fill="#C5CCD6" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" >Overload resolution: describe(int) vs describe(char*)</text><rect x="560" y="70" width="300" height="70" rx="10" fill="none" stroke="#C5CCD6" stroke-width="2" opacity=".5"/><text x="710" y="112" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="400" text-anchor="middle" >void describe(int)</text><rect x="560" y="190" width="300" height="70" rx="10" fill="none" stroke="#C5CCD6" stroke-width="2" opacity=".5"/><text x="710" y="232" fill="#C5CCD6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="400" text-anchor="middle" >void describe(char*)</text><g class="s" style="animation-delay:0s"><rect x="20" y="115" width="240" height="80" rx="12" fill="none" stroke="#FFC83D" stroke-width="3"/><text x="140" y="162" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" text-anchor="middle" >describe(0)</text><path d="M260 155 L560 105" stroke="#9DB83F" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="560" y="70" width="300" height="70" rx="10" fill="#9DB83F" fill-opacity=".22" stroke="#9DB83F" stroke-width="3.5"/><text x="450" y="300" fill="#9DB83F" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" >0 is an int: exact match, so the int overload wins</text></g><g class="s" style="animation-delay:3s"><rect x="20" y="115" width="240" height="80" rx="12" fill="none" stroke="#FFC83D" stroke-width="3"/><text x="140" y="162" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" text-anchor="middle" >describe(NULL)</text><path d="M260 155 L560 105" stroke="#FF8A1F" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M260 155 L560 225" stroke="#FF8A1F" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="560" y="70" width="300" height="70" rx="10" fill="#FF8A1F" fill-opacity=".22" stroke="#FF8A1F" stroke-width="3.5"/><rect x="560" y="190" width="300" height="70" rx="10" fill="#FF8A1F" fill-opacity=".22" stroke="#FF8A1F" stroke-width="3.5"/><text x="450" y="300" fill="#FF8A1F" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" >NULL is implementation-defined: ambiguous on GCC, may pick the int overload elsewhere</text></g><g class="s" style="animation-delay:6s"><rect x="20" y="115" width="240" height="80" rx="12" fill="none" stroke="#FFC83D" stroke-width="3"/><text x="140" y="162" fill="#FFC83D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="20" font-weight="700" text-anchor="middle" >describe(nullptr)</text><path d="M260 155 L560 225" stroke="#9DB83F" stroke-width="3.5" fill="none" stroke-linecap="round"/><rect x="560" y="190" width="300" height="70" rx="10" fill="#9DB83F" fill-opacity=".22" stroke="#9DB83F" stroke-width="3.5"/><text x="450" y="300" fill="#9DB83F" font-family="system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" >nullptr_t converts to pointers only, so the pointer overload wins</text></g>
</svg>
