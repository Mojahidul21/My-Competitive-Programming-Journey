<svg width="1400" height="140" viewBox="0 0 1400 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12" />
      <stop offset="55%" stop-color="#12151c" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="45%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#c9ccd1" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="0.4;2.2;0.4" dur="2.4s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur">
        <animate attributeName="stdDeviation" values="2.0;0.3;2.0" dur="2.8s" repeatCount="indefinite" />
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1400" height="140" fill="url(#bg)" />
  <!-- faint grid -->
  <g stroke="#1e222b" stroke-width="1">
    <path d="M0 35 H1400 M0 70 H1400 M0 105 H1400" />
    <path d="M100 0 V140 M300 0 V140 M500 0 V140 M700 0 V140 M900 0 V140 M1100 0 V140 M1300 0 V140" />
  </g>
  <!-- glow behind title -->
  <ellipse cx="250" cy="70" rx="230" ry="85" fill="url(#glow)" />
  <!-- title -->
  <text x="70" y="58" font-family="Segoe UI, Verdana, sans-serif" font-size="34" font-weight="700" fill="url(#titleGrad)">Code Templates</text>
  <text x="72" y="86" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#94a3b8">Reusable building blocks · Drop-in ready for contests</text>
  <!-- Left vignettes / icons flanking title -->
  <g transform="translate(28, 28)" fill="none" stroke="url(#accent)" stroke-width="1.8" stroke-linecap="round">
    <path d="M12 8 Q2 8 2 20 Q2 32 12 32">
      <animateTransform attributeName="transform" type="translate" values="0,0; -2,0; 0,0" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M28 8 Q38 8 38 20 Q38 32 28 32">
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,0; 0,0" dur="2s" repeatCount="indefinite" />
    </path>
    <rect x="18" y="14" width="2" height="12" fill="#5eead4" stroke="none">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
  <g transform="translate(22, 85)" stroke="url(#accent)" fill="none" stroke-width="1.4">
    <rect x="4" y="6" width="22" height="28" rx="2" />
    <rect x="8" y="2" width="14" height="8" rx="1.5" />
    <line x1="10" y1="16" x2="20" y2="16" />
    <line x1="10" y1="22" x2="18" y2="22" />
    <line x1="10" y1="28" x2="16" y2="28" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="2.5s" repeatCount="indefinite" />
  </g>
  <!-- Interactive/Dynamic elements in the middle stream -->
  <text x="520" y="36" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="url(#accent)" filter="url(#softGlow)"> template&lt;T&gt;
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
  </text>
  <g transform="translate(620, 28)" filter="url(#softGlow2)">
    <circle cx="0" cy="0" r="7" stroke="url(#accent)" stroke-width="1.5" fill="none" />
    <circle cx="16" cy="0" r="7" stroke="url(#accent)" stroke-width="1.5" fill="none" />
    <line x1="7" y1="0" x2="9" y2="0" stroke="url(#accent)" stroke-width="1.5" />
    <animateTransform attributeName="transform" type="translate" values="620,28; 623,25; 620,28" dur="3s" repeatCount="indefinite" />
  </g>
  <text x="610" y="52" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#94a3b8">DSU</text>
  <g transform="translate(700, 22)" fill="url(#accent)">
    <rect x="0" y="18" width="6" height="10" rx="1" />
    <rect x="9" y="12" width="6" height="16" rx="1" />
    <rect x="18" y="6" width="6" height="22" rx="1" />
    <rect x="27" y="0" width="6" height="28" rx="1" />
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
  </g>
  <text x="698" y="62" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#94a3b8">prefix</text>
  <text x="780" y="42" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="url(#accent)" filter="url(#softGlow)"> λ
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
  </text>
  <g transform="translate(830, 28)" font-family="Consolas, monospace" font-size="15" fill="url(#accent)">
    <text x="0" y="18">&lt;vector&gt;
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite" />
    </text>
  </g>
  <g transform="translate(940, 20)" stroke="url(#accent)" fill="none" stroke-width="1.4" filter="url(#softGlow2)">
    <circle cx="12" cy="6" r="5" />
    <circle cx="0" cy="24" r="4" />
    <circle cx="24" cy="24" r="4" />
    <line x1="12" y1="11" x2="0" y2="20" />
    <line x1="12" y1="11" x2="24" y2="20" />
    <animateTransform attributeName="transform" type="translate" values="940,20; 940,17; 940,20" dur="2.6s" repeatCount="indefinite" />
  </g>
  <text x="932" y="62" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#94a3b8">tree</text>
  <text x="1010" y="38" font-family="Consolas, monospace" font-size="13" fill="url(#accent)" filter="url(#softGlow)"> #define
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite" />
  </text>
  <g transform="translate(1090, 22)" fill="url(#accent)">
    <circle cx="0" cy="8" r="2.2" />
    <circle cx="10" cy="8" r="2.2" />
    <circle cx="20" cy="8" r="2.2" />
    <circle cx="5" cy="18" r="2.2" />
    <circle cx="15" cy="18" r="2.2" />
    <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" transform-origin="10px 13px" />
  </g>
  <text x="1082" y="48" font-family="Segoe UI, Verdana, sans-serif" font-size="11" fill="#94a3b8">sieve</text>
  <text x="1160" y="36" font-family="Consolas, monospace" font-size="14" fill="url(#accent)" filter="url(#softGlow)"> auto
    <animate attributeName="opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite" />
  </text>
  <!-- Terminal panel with live typing animation matching reference style -->
  <g transform="translate(1140, 55)">
    <rect x="0" y="0" width="230" height="68" rx="8" fill="#0f1116" stroke="#2a2e38" />
    <circle cx="14" cy="14" r="3.5" fill="#5eead4" />
    <circle cx="28" cy="14" r="3.5" fill="#94a3b8" />
    <circle cx="42" cy="14" r="3.5" fill="#475569" />
    <text x="12" y="36" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a5f3fc">
      <tspan fill="#64748b">1 </tspan>tourist
    </text>
    <text x="12" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#e2e8f0">
      <tspan fill="#64748b">2 </tspan> Ace_Azimuth_Aviator
    </text>
    <!-- reveal mask to create live-typing looping effect -->
    <rect x="12" y="24" width="210" height="38" fill="#0f1116">
      <animate attributeName="width" values="210;210;0;0;210" keyTimes="0;0.02;0.55;0.6;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="12;12;222;222;12" keyTimes="0;0.02;0.55;0.6;1" dur="6s" repeatCount="indefinite" />
    </rect>
    <!-- blinking cursor -->
    <rect x="14" y="26" width="2" height="14" fill="#5eead4">
      <animate attributeName="x" values="14;14;218;218;14" keyTimes="0;0.02;0.5;0.6;1" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;1;1;0;0;1;1" keyTimes="0;0.02;0.5;0.52;0.6;0.62;1" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>
  <!-- Bottom status texts with pulse animations -->
  <text x="540" y="110" font-family="Consolas, monospace" font-size="12" fill="#64748b"> // ready to paste
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
  </text>
  <text x="720" y="110" font-family="Consolas, monospace" font-size="12" fill="#5eead4"> find(u) · unite(u,v)
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite" />
  </text>
  <text x="920" y="110" font-family="Consolas, monospace" font-size="12" fill="#94a3b8"> pref[i] = pref[i-1] + a[i]
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </text>
</svg>