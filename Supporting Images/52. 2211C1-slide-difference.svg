  <text x="450" y="372" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">multiset(a) changes by − a <tspan font-size='12' dy='5'>s</tspan>
    <tspan dy='-5'> + a</tspan>
    <tspan font-size='12' dy='5'>i+1</tspan>
  </text>
  <text x="450" y="402" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">multiset(b) changes by − b <tspan font-size='12' dy='5'>s</tspan>
    <tspan dy='-5'> + b</tspan>
    <tspan font-size='12' dy='5'>i+1</tspan>
  </text>
  <text x="450" y="434" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif" font-size="16" font-weight="600" fill="#fef3c7">both windows equal ⇒ both changes equal ; a is a permutation ⇒ a <tspan font-size='12' dy='5'>s</tspan>
    <tspan dy='-5'> ≠ a</tspan>
    <tspan font-size='12' dy='5'>i+1</tspan>
  </text>
  <text x="450" y="458" text-anchor="middle" font-family="'Segoe UI','Trebuchet MS',Verdana,sans-serif" font-size="19" font-weight="800" fill="#86efac">⇒ b <tspan font-size='12' dy='5'>s</tspan>
    <tspan dy='-5'> = a</tspan>
    <tspan font-size='12' dy='5'>s</tspan>
    <tspan dy='-5'> and b</tspan>
    <tspan font-size='12' dy='5'>i+1</tspan>
    <tspan dy='-5'> = a</tspan>
    <tspan font-size='12' dy='5'>i+1</tspan>
  </text>
