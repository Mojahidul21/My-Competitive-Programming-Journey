<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Points of a convex function f(k) with a supporting line of slope minus lambda touching three collinear points, so K=2 lies inside a plateau" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="380" rx="14" fill="#0f172a"/>

  <!-- axes -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="60" y1="300" x2="780" y2="300"/>
    <line x1="60" y1="300" x2="60" y2="30"/>
  </g>
  <text x="790" y="305" font-family="Georgia, serif" font-size="18" fill="#94a3b8" font-style="italic">k</text>
  <text x="44" y="30" font-family="Georgia, serif" font-size="18" fill="#94a3b8" font-style="italic" text-anchor="end">f(k)</text>

  <!-- f values: k=0..6 -> 30,19,11,3,0,2,7 ; x = 90 + 110k ; y = 300 - 8f -->
  <polyline points="90,60 200,148 310,212 420,276 530,300 640,284 750,244" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- supporting line, slope -8 per unit k (touches k=1,2,3) -->
  <line x1="90" y1="84" x2="530" y2="340" stroke="#fde047" stroke-width="3" stroke-dasharray="10 6" clip-path="url(#clip)"/>
  <clipPath id="clip"><rect x="60" y="30" width="720" height="270"/></clipPath>

  <!-- points -->
  <g>
    <circle cx="90" cy="60" r="7" fill="#38bdf8"/>
    <circle cx="200" cy="148" r="9" fill="#fde047"/>
    <circle cx="310" cy="212" r="9" fill="#fde047"/>
    <circle cx="420" cy="276" r="9" fill="#fde047"/>
    <circle cx="530" cy="300" r="7" fill="#38bdf8"/>
    <circle cx="640" cy="284" r="7" fill="#38bdf8"/>
    <circle cx="750" cy="244" r="7" fill="#38bdf8"/>
  </g>

  <!-- pulsing marker on K=2 -->
  <circle cx="310" cy="212" r="14" fill="none" stroke="#f472b6" stroke-width="3">
    <animate attributeName="r" values="12;20;12" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- k labels -->
  <g font-family="Georgia, serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    <text x="90" y="322">0</text>
    <text x="200" y="322">1</text>
    <text x="310" y="322">2</text>
    <text x="420" y="322">3</text>
    <text x="530" y="322">4</text>
    <text x="640" y="322">5</text>
    <text x="750" y="322">6</text>
  </g>

  <!-- annotations -->
  <g font-family="Georgia, serif" font-size="16">
    <text x="330" y="96" fill="#fde047">slope −λ = −8  →  λ = 8</text>
    <text x="330" y="120" fill="#cbd5e1">k = 1, 2, 3 all sit on the line</text>
    <text x="330" y="144" fill="#f472b6">K = 2 is inside the plateau: h(8) − 8·2 = f(2)</text>
    <text x="520" y="176" fill="#94a3b8">successive slopes</text>
    <text x="520" y="196" fill="#94a3b8">−11, −8, −8, −3, 2, 5</text>
    <text x="520" y="216" fill="#94a3b8">never decrease → convex</text>
  </g>

  <text x="878" y="366" text-anchor="end" font-family="'Segoe Script', 'Brush Script MT', 'Bradley Hand', 'Lucida Handwriting', cursive" font-size="18" fill="#e2e8f0">Ace_Azimuth_Aviator</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
