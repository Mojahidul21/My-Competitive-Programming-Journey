<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="520" fill="#ffffff"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Boundary chain for n = 5, k = 7</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#555555">Six named boundaries, declared before any loop, fully describe the layout</text>

  <!-- Column headers -->
  <g font-size="14" fill="#555555" text-anchor="middle">
    <text x="215" y="82">1</text>
    <text x="285" y="82">2</text>
    <text x="355" y="82">3</text>
    <text x="425" y="82">4</text>
    <text x="495" y="82">5</text>
  </g>
  <!-- Row headers -->
  <g font-size="14" fill="#555555" text-anchor="middle">
    <text x="165" y="130">1</text>
    <text x="165" y="200">2</text>
    <text x="165" y="270">3</text>
    <text x="165" y="340">4</text>
    <text x="165" y="410">5</text>
  </g>

  <!-- Grid cells (r,c): x=180+(c-1)*70, y=90+(r-1)*70 -->
  <!-- Row1 -->
  <rect x="180" y="90" width="70" height="70" fill="#dbe9ff" stroke="#9db8e8"/>
  <rect x="250" y="90" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="320" y="90" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="390" y="90" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="460" y="90" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <!-- Row2 -->
  <rect x="180" y="160" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="250" y="160" width="70" height="70" fill="#dbe9ff" stroke="#9db8e8"/>
  <rect x="320" y="160" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="390" y="160" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="460" y="160" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <!-- Row3 -->
  <rect x="180" y="230" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="250" y="230" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="320" y="230" width="70" height="70" fill="#dbe9ff" stroke="#9db8e8"/>
  <rect x="390" y="230" width="70" height="70" fill="#ffe3c2" stroke="#e0a95f"/>
  <rect x="460" y="230" width="70" height="70" fill="#ffe3c2" stroke="#e0a95f"/>
  <!-- Row4 -->
  <rect x="180" y="300" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="250" y="300" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="320" y="300" width="70" height="70" fill="#d9f2d9" stroke="#8fc98f"/>
  <rect x="390" y="300" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="460" y="300" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <!-- Row5 -->
  <rect x="180" y="370" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="250" y="370" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="320" y="370" width="70" height="70" fill="#d9f2d9" stroke="#8fc98f"/>
  <rect x="390" y="370" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>
  <rect x="460" y="370" width="70" height="70" fill="#ffffff" stroke="#cccccc"/>

  <!-- Values -->
  <g font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    <text x="215" y="132">1</text>
    <text x="285" y="202">2</text>
    <text x="355" y="272">3</text>
    <text x="355" y="342">4</text>
    <text x="355" y="412">5</text>
    <text x="425" y="272">6</text>
    <text x="495" y="272">7</text>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#333333">
    <rect x="180" y="450" width="16" height="16" fill="#dbe9ff" stroke="#9db8e8"/>
    <text x="202" y="463">diagonal: diaStart=1 .. diaEnd=3</text>

    <rect x="180" y="474" width="16" height="16" fill="#d9f2d9" stroke="#8fc98f"/>
    <text x="202" y="487">vertical: verStart=4 .. verEnd=5</text>

    <rect x="430" y="450" width="16" height="16" fill="#ffe3c2" stroke="#e0a95f"/>
    <text x="452" y="463">horizontal: horStart=6 .. horEnd=7</text>

    <rect x="430" y="474" width="16" height="16" fill="#ffffff" stroke="#cccccc"/>
    <text x="452" y="487">remaining: filled 8..25 after the chain</text>
  </g>
</svg>
