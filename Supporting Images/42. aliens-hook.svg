<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="A tangent line sliding along a convex curve f(k), with the price lambda tilting the line" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" rx="16" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#94a3b8" stroke-opacity="0.12">
    <line x1="60" y1="60" x2="840" y2="60"/>
    <line x1="60" y1="120" x2="840" y2="120"/>
    <line x1="60" y1="180" x2="840" y2="180"/>
    <line x1="60" y1="240" x2="840" y2="240"/>
  </g>

  <!-- title -->
  <text x="450" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f8fafc" font-weight="bold">Put a price on K</text>
  <text x="450" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#cbd5e1">the Aliens Trick, or how a tangent line replaces a whole DP dimension</text>

  <!-- convex curve f(k) -->
  <path id="fcurve" d="M120,110 Q450,340 780,110" fill="none" stroke="url(#curve)" stroke-width="5" stroke-linecap="round"/>

  <!-- sliding tangent: follows the curve and tilts automatically -->
  <g visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0s" fill="freeze"/>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" calcMode="spline" keyPoints="0;1;0" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1">
      <mpath href="#fcurve"/>
    </animateMotion>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#fde047" stroke-width="3" stroke-dasharray="10 6"/>
    <circle r="9" fill="#fde047"/>
    <circle r="16" fill="none" stroke="#fde047" stroke-opacity="0.6">
      <animate attributeName="r" values="12;22;12" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating symbols -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#fde047">
    <text x="110" y="170" font-size="40">
      λ
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="font-size" values="40;52;40" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="190" font-size="34" fill="#f472b6">
      K
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="font-size" values="30;46;30" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="420" y="285" font-size="26" fill="#38bdf8" text-anchor="middle">
      f(k)
      <animate attributeName="opacity" values="1;0.35;1" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="250" y="250" font-size="22" fill="#a5b4fc">
      min
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="620" y="250" font-size="22" fill="#a5b4fc">
      + λk
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- signature -->
  <text x="878" y="306" text-anchor="end" font-family="'Segoe Script', 'Brush Script MT', 'Bradley Hand', 'Lucida Handwriting', cursive" font-size="18" fill="#e2e8f0">Ace_Azimuth_Aviator</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
