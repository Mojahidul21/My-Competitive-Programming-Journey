<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e3a5f" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8z" fill="#fbbf24" />
    </marker>
  </defs>
  <rect width="900" height="300" rx="18" fill="url(#bg)" />
  <text x="450" y="38" text-anchor="middle" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#f8fafc">The Mirror Sentinel</text>
  <text x="450" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#c7d2fe">the missing neighbour is replaced by a copy of the real one, so both welds are the same</text>
  <g font-family="Georgia,serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#f8fafc">
    <rect x="70" y="140" width="80" height="56" rx="10" fill="#334155" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="2" />
    <text x="110" y="175">a[0]</text>
    <rect x="170" y="140" width="80" height="56" rx="10" fill="#16a34a" />
    <text x="210" y="175">a[1]</text>
    <rect x="270" y="140" width="80" height="56" rx="10" fill="#1d4ed8" />
    <text x="310" y="175">a[2]</text>
    <text x="410" y="175" font-size="26" fill="#94a3b8">· · ·</text>
    <rect x="470" y="140" width="80" height="56" rx="10" fill="#1d4ed8" />
    <text x="510" y="175">a[n-1]</text>
    <rect x="570" y="140" width="80" height="56" rx="10" fill="#16a34a" />
    <text x="610" y="175">a[n]</text>
    <rect x="670" y="140" width="80" height="56" rx="10" fill="#334155" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="2" />
    <text x="710" y="175">a[n+1]</text>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#ar)">
    <path d="M310 135 C310 80 110 80 110 132">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </path>
    <path d="M510 135 C510 80 710 80 710 132">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </path>
  </g>
  <g font-family="Georgia,serif" font-size="14" fill="#fde68a" text-anchor="middle">
    <text x="210" y="100">a[0] = a[2]</text>
    <text x="610" y="100">a[n+1] = a[n-1]</text>
  </g>
  <text x="450" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#86efac">gl = gr → lcm(gl, gr) = gl : the one-neighbour rule falls out of the general rule</text>
  <g fill="#fde68a" filter="url(#glow)">
    <path d="M640 262 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite" />
    </path>
    <path d="M868 250 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </path>
  </g>
  <text x="880" y="286" text-anchor="end" font-family="'Segoe Script','Brush Script MT','Lucida Handwriting','Comic Sans MS',cursive" font-size="20" fill="#fef3c7" filter="url(#glow)">Ace_Azimuth_Aviator</text>
</svg>